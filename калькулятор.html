<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Калькулятор</title>
    
    <meta name="description" content="Мощный калькулятор: обычный, инженерный, дроби, конвертер.">
    <meta name="keywords" content="калькулятор, инженерный, дроби, конвертер, математика">
    <meta name="author" content="GenoTheError, Geno">
    <meta name="robots" content="index, follow">
    
    <link rel="icon" href="ico.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Чтобы панели не скроллили страницу */
        }

        /* Шапка */
        .calc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #1a202c;
            border-bottom: 1px solid #2d3748;
            z-index: 10;
        }
        .calc-back {
            color: #90cdf4;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 8px;
        }
        .calc-actions {
            display: flex;
            gap: 8px;
        }
        .calc-btn-icon {
            background: #2d3748;
            color: #90cdf4;
            border: 1px solid #4299e1;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-family: inherit;
            transition: all 0.2s;
        }
        .calc-btn-icon:active {
            background: #4299e1;
            color: white;
        }

        /* Экран */
        .calc-display {
            padding: 20px 16px;
            text-align: right;
            background: #0f1419;
            flex-shrink: 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .calc-expr {
            color: #718096;
            font-size: 18px;
            min-height: 24px;
            word-wrap: break-word;
        }
        .calc-result {
            color: #e2e8f0;
            font-size: 42px;
            font-weight: 700;
            word-wrap: break-word;
            margin-top: 4px;
        }

        /* Клавиатура */
        .calc-keys-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .calc-keys {
            display: grid;
            gap: 8px;
            flex-grow: 1;
            align-content: end;
        }
        
        .keys-basic { grid-template-columns: repeat(4, 1fr); }
        .keys-scientific { grid-template-columns: repeat(5, 1fr); }
        .keys-fractions { grid-template-columns: repeat(3, 1fr); }
        
        .key {
            background: #2d3748;
            color: #e2e8f0;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 500;
            padding: 20px 0;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.1s;
            user-select: none;
            -webkit-user-select: none;
        }
        .key:active { background: #4a5568; }
        .key.func { background: #4a5568; color: #90cdf4; }
        .key.op { background: #3182ce; color: white; }
        .key.eq { background: #38a169; color: white; grid-column: span 2; }
        .key.zero { grid-column: span 2; }
        
        .keys-scientific .key { font-size: 18px; padding: 16px 0; }
        .keys-fractions .key { font-size: 20px; }

        /* Блок конвертера */
        .converter-panel {
            display: none;
            flex-direction: column;
            gap: 16px;
            padding: 16px;
            background: #1a202c;
            border-radius: 12px;
            border: 1px solid #2d3748;
            margin: 16px;
            width: calc(100% - 32px);
        }
        .converter-panel.active {
            display: flex;
        }
        .converter-row {
            display: flex;
            gap: 10px;
        }
        .converter-input {
            flex: 1;
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 20px;
            outline: none;
            min-width: 0;
        }
        .converter-select {
            background: #2d3748;
            border: 2px solid #4a5568;
            border-radius: 8px;
            padding: 12px;
            color: #e2e8f0;
            font-size: 16px;
            outline: none;
        }

        /* Панели */
        .side-panel {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 100%;
            max-width: 350px;
            background: #1a202c;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .panel-right { right: 0; transform: translateX(100%); }
        .panel-left { left: 0; transform: translateX(-100%); }
        .side-panel.open { transform: translateX(0); }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #2d3748;
        }
        .panel-title { color: #e2e8f0; font-size: 20px; font-weight: 600; margin: 0; }
        .panel-close {
            background: none;
            border: none;
            color: #e53e3e;
            font-size: 24px;
            cursor: pointer;
        }
        .panel-content {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
        }
        
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid #2d3748;
            color: #e2e8f0;
            cursor: pointer;
        }
        .history-item:active { background: #2d3748; }
        .history-expr { font-size: 14px; color: #718096; }
        .history-res { font-size: 18px; font-weight: 600; }

        .settings-section { margin-bottom: 24px; }
        .settings-title {
            color: #63b3ed;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .settings-item {
            background: #2d3748;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-item.active {
            background: #4299e1;
            color: white;
        }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 90;
            display: none;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="calc-header">
        <a href="index.html" class="calc-back">← Назад</a>
        <div class="calc-actions">
            <button class="calc-btn-icon" id="btn-settings" title="Настройки">⚙️</button>
            <button class="calc-btn-icon" id="btn-history" title="История">🕒</button>
        </div>
    </header>

    <!-- Экран -->
    <div class="calc-display" id="calc-display">
        <div class="calc-expr" id="calc-expr"></div>
        <div class="calc-result" id="calc-result">0</div>
    </div>

    <!-- Обертка для клавиатуры -->
    <div class="calc-keys-wrapper" id="keys-wrapper">
        <div class="calc-keys keys-basic" id="calc-keys"></div>
    </div>

    <!-- Блок конвертера (скрыт по умолчанию) -->
    <div class="converter-panel" id="converter-panel">
        <div class="converter-row">
            <input type="number" class="converter-input" id="conv-val" value="1">
            <select class="converter-select" id="conv-from"></select>
        </div>
        <div class="converter-row">
            <input type="text" class="converter-input" id="conv-res" readonly style="background:#0f1419;">
            <select class="converter-select" id="conv-to"></select>
        </div>
    </div>

    <!-- Панель настроек -->
    <div class="side-panel panel-left" id="panel-settings">
        <div class="panel-header">
            <h2 class="panel-title">Настройки</h2>
            <button class="panel-close" data-close="panel-settings">✕</button>
        </div>
        <div class="panel-content">
            <div class="settings-section">
                <div class="settings-title">Калькуляторы</div>
                <div class="settings-item active" data-mode="basic">🔢 Обычный</div>
                <div class="settings-item" data-mode="scientific">🧪 Инженерный</div>
                <div class="settings-item" data-mode="fractions">🍰 Дроби</div>
            </div>
            <div class="settings-section">
                <div class="settings-title">Конвертеры</div>
                <div class="settings-item" data-mode="length">📏 Длина</div>
                <div class="settings-item" data-mode="mass">⚖️ Масса</div>
                <div class="settings-item" data-mode="data">💾 Данные</div>
            </div>
        </div>
    </div>

    <!-- Панель истории -->
    <div class="side-panel panel-right" id="panel-history">
        <div class="panel-header">
            <h2 class="panel-title">История</h2>
            <button class="panel-close" data-close="panel-history">✕</button>
        </div>
        <div class="panel-content">
            <ul class="history-list" id="history-list"></ul>
            <button class="settings-item" id="clear-history" style="justify-content: center; color: #e53e3e; margin-top: 20px;">🗑️ Очистить</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <script>
        // ==========================================
        // СОСТОЯНИЕ
        // ==========================================
        let currentExpr = '';
        let currentResult = '0';
        let mode = 'basic';
        let history = JSON.parse(localStorage.getItem('calc-history') || '[]');

        const exprEl = document.getElementById('calc-expr');
        const resultEl = document.getElementById('calc-result');
        const keysWrapper = document.getElementById('keys-wrapper');
        const keysEl = document.getElementById('calc-keys');
        const converterPanel = document.getElementById('converter-panel');
        const historyList = document.getElementById('history-list');

        // ==========================================
        // ЭКРАН И ВЫЧИСЛЕНИЯ
        // ==========================================
        function updateDisplay() {
            exprEl.textContent = currentExpr;
            resultEl.textContent = currentResult;
        }

        function calculate() {
            try {
                if (!currentExpr) return;
                let exprToEval = currentExpr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/−/g, '-')
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/√\(/g, 'Math.sqrt(')
                    .replace(/\^2/g, '**2');

                let res = Function('"use strict"; return (' + exprToEval + ')')();
                
                if (typeof res === 'number' && !Number.isInteger(res)) {
                    res = parseFloat(res.toFixed(10));
                }
                
                currentResult = String(res);
                
                history.unshift({ expr: currentExpr, res: currentResult });
                if (history.length > 50) history.pop();
                localStorage.setItem('calc-history', JSON.stringify(history));
                renderHistory();
                
            } catch (e) {
                currentResult = 'Ошибка';
            }
            updateDisplay();
        }

        // ==========================================
        // КЛАВИАТУРА
        // ==========================================
        keysEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.key');
            if (!btn) return;
            const val = btn.dataset.val;
            
            if (val === 'C') { currentExpr = ''; currentResult = '0'; }
            else if (val === 'CE') { currentResult = '0'; }
            else if (val === 'DEL') { currentExpr = currentExpr.slice(0, -1); }
            else if (val === '=') { calculate(); return; }
            else if (val === 'x²') { currentExpr += '^2'; }
            else if (val === '√') { currentExpr += '√('; }
            else if (val === 'sin') { currentExpr += 'sin('; }
            else if (val === 'cos') { currentExpr += 'cos('; }
            else if (val === 'tan') { currentExpr += 'tan('; }
            else if (val === 'π') { currentExpr += 'π'; }
            else if (val === 'e') { currentExpr += 'e'; }
            else { currentExpr += val; }
            
            updateDisplay();
        });

        function renderKeys(type) {
            let html = '';
            if (type === 'basic') {
                html = `
                    <button class="key func" data-val="C">C</button>
                    <button class="key func" data-val="CE">CE</button>
                    <button class="key func" data-val="DEL">←</button>
                    <button class="key op" data-val="/">÷</button>
                    <button class="key" data-val="7">7</button>
                    <button class="key" data-val="8">8</button>
                    <button class="key" data-val="9">9</button>
                    <button class="key op" data-val="*">×</button>
                    <button class="key" data-val="4">4</button>
                    <button class="key" data-val="5">5</button>
                    <button class="key" data-val="6">6</button>
                    <button class="key op" data-val="-">−</button>
                    <button class="key" data-val="1">1</button>
                    <button class="key" data-val="2">2</button>
                    <button class="key" data-val="3">3</button>
                    <button class="key op" data-val="+">+</button>
                    <button class="key zero" data-val="0">0</button>
                    <button class="key" data-val=".">.</button>
                    <button class="key eq" data-val="=">=</button>
                `;
                keysEl.className = 'calc-keys keys-basic';
            } else if (type === 'scientific') {
                html = `
                    <button class="key func" data-val="C">C</button>
                    <button class="key func" data-val="CE">CE</button>
                    <button class="key func" data-val="DEL">←</button>
                    <button class="key func" data-val="(">(</button>
                    <button class="key func" data-val=")">)</button>
                    <button class="key func" data-val="sin">sin</button>
                    <button class="key func" data-val="cos">cos</button>
                    <button class="key func" data-val="tan">tan</button>
                    <button class="key func" data-val="√">√</button>
                    <button class="key func" data-val="x²">x²</button>
                    <button class="key" data-val="7">7</button>
                    <button class="key" data-val="8">8</button>
                    <button class="key" data-val="9">9</button>
                    <button class="key op" data-val="/">÷</button>
                    <button class="key func" data-val="π">π</button>
                    <button class="key" data-val="4">4</button>
                    <button class="key" data-val="5">5</button>
                    <button class="key" data-val="6">6</button>
                    <button class="key op" data-val="*">×</button>
                    <button class="key func" data-val="e">e</button>
                    <button class="key" data-val="1">1</button>
                    <button class="key" data-val="2">2</button>
                    <button class="key" data-val="3">3</button>
                    <button class="key op" data-val="-">−</button>
                    <button class="key op" data-val="+">+</button>
                    <button class="key zero" data-val="0">0</button>
                    <button class="key" data-val=".">.</button>
                    <button class="key eq" data-val="=">=</button>
                `;
                keysEl.className = 'calc-keys keys-scientific';
            } else if (type === 'fractions') {
                html = `
                    <button class="key func" data-val="C">C</button>
                    <button class="key func" data-val="DEL">←</button>
                    <button class="key op" data-val="/">÷</button>
                    <button class="key" data-val="7">7</button>
                    <button class="key" data-val="8">8</button>
                    <button class="key" data-val="9">9</button>
                    <button class="key" data-val="4">4</button>
                    <button class="key" data-val="5">5</button>
                    <button class="key" data-val="6">6</button>
                    <button class="key" data-val="1">1</button>
                    <button class="key" data-val="2">2</button>
                    <button class="key" data-val="3">3</button>
                    <button class="key zero" data-val="0">0</button>
                    <button class="key" data-val=".">.</button>
                    <button class="key eq" data-val="=">=</button>
                `;
                keysEl.className = 'calc-keys keys-fractions';
            }
            keysEl.innerHTML = html;
        }

        // ==========================================
        // КОНВЕРТЕРЫ
        // ==========================================
        function setupConverter(type) {
            // Скрываем клавиатуру, показываем конвертер
            keysWrapper.style.display = 'none';
            converterPanel.classList.add('active');

            let units = [];
            if (type === 'length') units = [{id:'m', name:'Метры (м)'}, {id:'cm', name:'Сантиметры (см)'}, {id:'in', name:'Дюймы (in)'}];
            if (type === 'mass') units = [{id:'kg', name:'Килограммы (кг)'}, {id:'g', name:'Граммы (г)'}, {id:'lb', name:'Фунты (lb)'}];
            if (type === 'data') units = [{id:'mb', name:'Мегабайты (МБ)'}, {id:'gb', name:'Гигабайты (ГБ)'}];

            const fromSel = document.getElementById('conv-from');
            const toSel = document.getElementById('conv-to');
            const inVal = document.getElementById('conv-val');
            const resVal = document.getElementById('conv-res');

            const optionsHTML = units.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            fromSel.innerHTML = optionsHTML;
            toSel.innerHTML = optionsHTML;

            if (units.length > 1) toSel.selectedIndex = 1;

            function convert() {
                let v = parseFloat(inVal.value) || 0;
                let from = fromSel.value;
                let to = toSel.value;
                let base = v;
                
                // В базовые (м, кг, МБ)
                if (type === 'length') {
                    if (from === 'cm') base = v / 100;
                    if (from === 'in') base = v * 0.0254;
                } else if (type === 'mass') {
                    if (from === 'g') base = v / 1000;
                    if (from === 'lb') base = v * 0.453592;
                } else if (type === 'data') {
                    if (from === 'gb') base = v * 1024;
                }

                // Из базовых
                let result = base;
                if (type === 'length') {
                    if (to === 'cm') result = base * 100;
                    if (to === 'in') result = base / 0.0254;
                } else if (type === 'mass') {
                    if (to === 'g') result = base * 1000;
                    if (to === 'lb') result = base / 0.453592;
                } else if (type === 'data') {
                    if (to === 'gb') result = base / 1024;
                }

                resVal.value = parseFloat(result.toFixed(6));
            }

            // Удаляем старые обработчики, чтобы не дублировались
            inVal.oninput = convert;
            fromSel.onchange = convert;
            toSel.onchange = convert;
            
            convert();
        }

        // ==========================================
        // ПЕРЕКЛЮЧЕНИЕ РЕЖИМОВ ИЗ НАСТРОЕК
        // ==========================================
        document.querySelectorAll('.settings-item[data-mode]').forEach(item => {
            item.addEventListener('click', () => {
                const newMode = item.dataset.mode;
                mode = newMode;
                
                document.querySelectorAll('.settings-item[data-mode]').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                if (newMode === 'length' || newMode === 'mass' || newMode === 'data') {
                    // Включаем конвертер
                    document.getElementById('calc-display').style.display = 'none';
                    setupConverter(newMode);
                } else {
                    // Включаем обычный калькулятор
                    document.getElementById('calc-display').style.display = 'block';
                    converterPanel.classList.remove('active');
                    keysWrapper.style.display = 'flex';
                    renderKeys(newMode);
                }
                
                closePanels();
            });
        });

        // ==========================================
        // ИСТОРИЯ И ПАНЕЛИ
        // ==========================================
        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<li style="color: #718096; text-align: center; padding: 20px;">История пуста</li>';
                return;
            }
            historyList.innerHTML = history.map(h => `
                <li class="history-item" data-expr="${h.expr}">
                    <div class="history-expr">${h.expr}</div>
                    <div class="history-res">= ${h.res}</div>
                </li>
            `).join('');
            
            document.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    currentExpr = item.dataset.expr;
                    if (mode === 'length' || mode === 'mass' || mode === 'data') {
                        // Если в конвертере, переключаем на обычный
                        document.querySelector('.settings-item[data-mode="basic"]').click();
                    }
                    updateDisplay();
                    closePanels();
                });
            });
        }

        document.getElementById('clear-history').addEventListener('click', () => {
            history = [];
            localStorage.removeItem('calc-history');
            renderHistory();
        });

        const overlay = document.getElementById('overlay');
        function openPanel(id) {
            document.getElementById(id).classList.add('open');
            overlay.classList.add('active');
        }
        function closePanels() {
            document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('open'));
            overlay.classList.remove('active');
        }
        
        document.getElementById('btn-history').addEventListener('click', () => openPanel('panel-history'));
        document.getElementById('btn-settings').addEventListener('click', () => openPanel('panel-settings'));
        overlay.addEventListener('click', closePanels);
        document.querySelectorAll('.panel-close').forEach(btn => {
            btn.addEventListener('click', closePanels);
        });

        // ==========================================
        // СТАРТ
        // ==========================================
        renderHistory();
        renderKeys('basic');
    </script>
</body>
</html>
