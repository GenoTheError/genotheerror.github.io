    <link rel="stylesheet" href="style.css">
    <style>
        .search-box {
            background: #2d3748;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 2px solid #4299e1;
        }
        
        #searchInput {
            width: 100%;
            font-size: 18px;
            padding: 14px 16px;
            border: none;
            border-radius: 8px;
            background: #1a202c;
            color: #e2e8f0;
            outline: none;
        }
        
        #searchInput::placeholder {
            color: #718096;
        }
        
        #searchResults {
            margin-top: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .search-item {
            display: block;
            padding: 12px 16px;
            background: #1a202c;
            border-radius: 8px;
            margin-bottom: 8px;
            color: #e2e8f0;
            text-decoration: none;
            border-left: 3px solid #4299e1;
            transition: all 0.2s;
        }
        
        .search-item:hover {
            background: #2d3748;
            text-decoration: none;
            border-left-color: #63b3ed;
        }
        
        .search-item .item-name {
            font-weight: 600;
            color: #90cdf4;
        }
        
        .search-item .item-cat {
            font-size: 13px;
            color: #718096;
            margin-top: 2px;
        }
        
        .category-section {
            margin-bottom: 28px;
        }
        
        .category-title {
            font-size: 20px;
            color: #63b3ed;
            margin-bottom: 12px;
            padding-left: 12px;
            border-left: 4px solid #4299e1;
        }
        
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }
        
        .article-card {
            display: block;
            background: #1a202c;
            border: 1px solid #2d3748;
            border-radius: 10px;
            padding: 14px 16px;
            color: #e2e8f0;
            text-decoration: none;
            transition: all 0.2s;
        }
        
        .article-card:hover {
            background: #2d3748;
            border-color: #4299e1;
            text-decoration: none;
            transform: translateY(-2px);
        }
        
        .article-card .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }
        
        .article-card .name {
            font-weight: 600;
            color: #90cdf4;
            display: block;
        }
        
        /* Ссылка "Об..." в правом верхнем углу */
        .about-link {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #2d3748;
            color: #90cdf4;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            z-index: 100;
            border: 1px solid #4299e1;
            transition: all 0.2s;
        }
        
        .about-link:hover {
            background: #4299e1;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    
    <!-- ССЫЛКА "ОБ..." В ПРАВОМ ВЕРХНЕМ УГЛУ -->

    <!-- ПОИСК -->

               placeholder="🔍 Поиск по базе... (например: гранит, золото, SCP)" 
               autocomplete="off">

    <!-- ОГЛАВЛЕНИЕ -->

        <!-- 🎭 SCP -->

        <!-- 🌊 ЗАКУЛИСЬЕ -->

            </div>
        </div>
        
        <!-- 📺 ЮТУБЕРЫ -->
        <div class="category-section">
            <div class="category-title">📺 Ютуберы</div>
            <div class="articles-grid" data-category="Ютуберы">

    <div class="footer">
        База Знаний GenoTheError • <span id="totalCount">0</span> статей
    </div>

    <script>
        // ==========================================
        // ПОИСК — автоматически читает все статьи с главной
        // ==========================================
        
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsBox = document.getElementById('searchResults');
            
            if (query.length < 1) {
                resultsBox.innerHTML = '';
                return;
            }
            
            const allArticles = document.querySelectorAll('.article-card');
            const results = [];
            
            allArticles.forEach(card => {
                const name = card.getAttribute('data-name') || card.querySelector('.name').textContent.toLowerCase();
                const categorySection = card.closest('.category-section');
                const category = categorySection ? categorySection.querySelector('.category-title').textContent : '';
                const link = card.getAttribute('href');
                const icon = card.querySelector('.icon')?.textContent || '📄';
                const displayName = card.querySelector('.name')?.textContent || name;
                
                if (name.includes(query) || category.toLowerCase().includes(query) || displayName.toLowerCase().includes(query)) {
                    results.push({ name: displayName, category, link, icon });
                }
            });
            
            if (results.length === 0) {
                resultsBox.innerHTML = `<div style="color: #718096; padding: 12px; text-align: center;">Ничего не найдено по запросу "${query}"</div>`;
                return;
            }
            
            resultsBox.innerHTML = results.map(r => `
                <a href="${r.link}" class="search-item">
                    <div class="item-name">${r.icon} ${r.name}</div>
                    <div class="item-cat">${r.category}</div>
                </a>
            `).join('');
        }
        
        document.getElementById('searchInput').addEventListener('input', performSearch);
        
        function updateCount() {
            const count = document.querySelectorAll('.article-card').length;
            document.getElementById('totalCount').textContent = count;
        }
        updateCount();
    </script>
</body>
