<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор никнеймов</title>
    <link rel="icon" href="../ico.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        .ник-зона {
    background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
    border: 3px solid #4299e1;
    border-radius: 16px;
    padding: 20px 16px;
    text-align: center;
    margin: 20px 0;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
}
        .ник {
    font-size: 22px;
    font-weight: 800;
    color: #90cdf4;
    word-break: break-all;
    overflow-wrap: anywhere;
    font-family: monospace;
    text-shadow: 0 0 20px rgba(144, 205, 244, 0.5);
    animation: ник-въезд 0.4s ease;
    line-height: 1.3;
    max-width: 100%;
    padding: 0 8px;
}
        @keyframes ник-въезд {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .кнопки {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
        }
        .кнопка {
            background: #4299e1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .кнопка:hover {
            background: #3182ce;
            transform: scale(1.02);
        }
        .кнопка.вторичная {
            background: #2d3748;
            color: #90cdf4;
        }
        .кнопка.вторичная:hover {
            background: #4a5568;
        }
        .кнопка.большая {
            grid-column: 1 / -1;
            font-size: 18px;
            padding: 18px;
        }
        
        .история {
            background: #1a202c;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .история .назв {
            color: #a0aec0;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .история-item {
            display: inline-block;
            background: #2d3748;
            color: #90cdf4;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-family: monospace;
            margin: 3px;
            cursor: pointer;
        }
        .история-item:hover {
            background: #4299e1;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="../игры.html" class="back-btn">← Назад</a>
        <span class="badge purple">🎨 Творчество</span>
    </div>
    
    <h1>✨ Генератор никнеймов</h1>
    
    <div class="ник-зона">
        <div class="ник" id="ник">Нажми «Сгенерировать»</div>
    </div>
    
    <div class="кнопки">
        <button class="кнопка большая" id="кнГен">🎲 Сгенерировать ник</button>
        <button class="кнопка вторичная" id="кнКопировать">📋 Копировать</button>
        <button class="кнопка вторичная" id="кнОчистить">🗑️ Очистить историю</button>
    </div>
    
    <div class="история">
        <div class="назв">История (последние 10):</div>
        <div id="история"></div>
    </div>
    
    <script>
        const прилагательные = [
            'Тёмный', 'Быстрый', 'Ледяной', 'Огненный', 'Тихий',
            'Бешеный', 'Хитрый', 'Злой', 'Добрый', 'Дикий',
            'Могучий', 'Странный', 'Весёлый', 'Грозный', 'Полуночный',
            'Кровавый', 'Золотой', 'Серебряный', 'Кибернетический', 'Легендарный',
            'Мёртвый', 'Живой', 'Скрытый', 'Яркий', 'Голодный',
            'Забытый', 'Проклятый', 'Святой', 'Грешный', 'Безумный'
        ];
        
        const существительные = [
            'Волк', 'Дракон', 'Тигр', 'Лис', 'Медведь',
            'Орёл', 'Ворон', 'Кот', 'Пёс', 'Змей',
            'Рыцарь', 'Маг', 'Воин', 'Убийца', 'Странник',
            'Король', 'Призрак', 'Демон', 'Ангел', 'Бог',
            'Гном', 'Эльф', 'Орк', 'Вампир', 'Оборотень',
            'Пират', 'Ниндзя', 'Самурай', 'Ковбой', 'Робот',
            'Пекарь', 'Повар', 'Инженер', 'Учёный', 'Поэт'
        ];
        
        const приставки = ['', '', '', 'Mr', 'Xx', 'Pro', 'Super', 'Dark', 'Light', 'Neo', 'Old'];
        const суффиксы = ['', '', '', 'TV', 'YT', 'HD', 'X', 'Pro', '2000', '228', '777', 'Official'];
        const разделители = ['', '', '_', '-', 'x'];
        const числа = ['', '', '', '1', '2', '3', '7', '13', '42', '99', '666', '777', '2007'];
        
        let история = [];
        try {
            const с = localStorage.getItem('ник-история');
            if (с) история = JSON.parse(с);
        } catch (e) {}
        
        const никЭл = document.getElementById('ник');
        const историяЭл = document.getElementById('история');
        
        function сгенерировать() {
            const прил = прилагательные[Math.floor(Math.random() * прилагательные.length)];
            const сущ = существительные[Math.floor(Math.random() * существительные.length)];
            const прист = приставки[Math.floor(Math.random() * приставки.length)];
            const суф = суффиксы[Math.floor(Math.random() * суффиксы.length)];
            const разд = разделители[Math.floor(Math.random() * разделители.length)];
            const число = числа[Math.floor(Math.random() * числа.length)];
            
            // Варианты генерации
            const вариант = Math.floor(Math.random() * 5);
            let ник;
            
            if (вариант === 0) ник = прил + разд + сущ;
            else if (вариант === 1) ник = прил + сущ + число;
            else if (вариант === 2) ник = прист + разд + сущ + суф;
            else if (вариант === 3) ник = прил + разд + сущ + разд + число;
            else ник = прист + разд + прил + разд + сущ + суф + число;
            
            никЭл.textContent = ник;
            никЭл.style.animation = 'none';
            setTimeout(() => никЭл.style.animation = 'ник-въезд 0.4s ease', 10);
            
            // История
            история.unshift(ник);
            if (история.length > 10) история = история.slice(0, 10);
            сохранить();
            отрисоватьИсторию();
        }
        
        function сохранить() {
            try {
                localStorage.setItem('ник-история', JSON.stringify(история));
            } catch (e) {}
        }
        
        function отрисоватьИсторию() {
            историяЭл.innerHTML = '';
            история.forEach(н => {
                const div = document.createElement('span');
                div.className = 'история-item';
                div.textContent = н;
                div.onclick = () => {
                    никЭл.textContent = н;
                };
                историяЭл.appendChild(div);
            });
        }
        
        document.getElementById('кнГен').onclick = сгенерировать;
        
        document.getElementById('кнКопировать').onclick = () => {
            const текст = никЭл.textContent;
            if (текст === 'Нажми «Сгенерировать»') return;
            navigator.clipboard.writeText(текст).then(() => {
                alert('✅ Скопировано: ' + текст);
            }).catch(() => {
                alert('Не удалось скопировать');
            });
        };
        
        document.getElementById('кнОчистить').onclick = () => {
            if (!confirm('Очистить историю?')) return;
            история = [];
            сохранить();
            отрисоватьИсторию();
        };
        
        отрисоватьИсторию();
    </script>
</body>
</html>
