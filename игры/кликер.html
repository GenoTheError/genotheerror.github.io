<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер 2.0 - Два Мира</title>
    <link rel="icon" href="../ico.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        .мир-переключатель { display: flex; gap: 8px; margin-bottom: 16px; }
        .мир-кнопка { flex: 1; background: #1a202c; color: #718096; border: 2px solid #2d3748; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .мир-кнопка.активен-1 { background: #744210; color: #f6e05e; border-color: #d69e2e; }
        .мир-кнопка.активен-2 { background: #2a4365; color: #90cdf4; border-color: #4299e1; }

        .печенька-зона { display: flex; justify-content: center; margin: 20px 0; }
        #объект-клика { font-size: 100px; cursor: pointer; user-select: none; -webkit-user-select: none; transition: transform 0.05s; text-shadow: 0 0 20px rgba(246, 224, 94, 0.4); }
        #объект-клика:active { transform: scale(0.9); }

        .статистика { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .стат-блок { background: #1a202c; border: 1px solid #2d3748; padding: 12px; border-radius: 10px; text-align: center; }
        .стат-блок .label { color: #718096; font-size: 12px; }
        .стат-блок .value { color: #f6e05e; font-size: 20px; font-weight: 700; }

        .вкладки { display: flex; gap: 6px; margin-bottom: 16px; }
        .вкладка { flex: 1; background: #2d3748; color: #a0aec0; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .вкладка.активна { background: #4299e1; color: white; }

        .улучшение { display: flex; justify-content: space-between; align-items: center; background: #1a202c; border: 1px solid #2d3748; padding: 12px 16px; border-radius: 10px; transition: all 0.2s; margin-bottom: 8px; }
        .улучшение.доступно { cursor: pointer; border-color: #38a169; }
        .улучшение.доступно:hover { background: #2d3748; }
        .улучшение.недоступно { opacity: 0.5; cursor: not-allowed; }
        .улучшение .назв { color: #90cdf4; font-weight: 600; font-size: 15px; }
        .улучшение .опис { color: #718096; font-size: 12px; margin-top: 2px; }
        .улучшение .цена { color: #f6e05e; font-weight: 700; font-size: 14px; text-align: right; }
        
        .вкладка-содержимое { display: none; }
        .вкладка-содержимое.активна { display: block; }

        .кнопка-сброс { display: block; width: 100%; margin-top: 30px; background: transparent; color: #e53e3e; border: 1px solid #e53e3e; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .кнопка-сброс:hover { background: #e53e3e; color: white; }
        
        .модалка { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .модалка.активна { display: flex; }
        .модалка-контент { background: #1a202c; border: 2px solid #4299e1; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
        .модалка-контент h2 { color: #90cdf4; margin-top: 0; }
        .модалка-контент textarea { width: 100%; height: 100px; background: #0f1419; color: #e2e8f0; border: 1px solid #2d3748; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; resize: none; margin-bottom: 10px; }
        
        .уведомление { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #38a169; color: white; padding: 10px 20px; border-radius: 20px; font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .уведомление.активно { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../игры.html" class="back-btn">← Назад</a>
        <span class="badge purple">🖱️ Кликер 2.0</span>
    </div>

    <h1>🍪 Кликер 2.0</h1>

    <div class="мир-переключатель">
        <button class="мир-кнопка активен-1" id="btn-мир-1">🍪 Мир Печенек</button>
        <button class="мир-кнопка" id="btn-мир-2">💎 Мир Кристаллов</button>
    </div>

    <!-- МИР 1 -->
    <div id="мир-1" style="display:block;">
        <div class="статистика">
            <div class="стат-блок"><div class="label">Печеньки</div><div class="value" id="счёт-1">0</div></div>
            <div class="стат-блок"><div class="label">В секунду</div><div class="value" id="сек-1">0</div></div>
            <div class="стат-блок"><div class="label">За клик</div><div class="value" id="клик-1">1</div></div>
            <div class="стат-блок"><div class="label">Множитель Кристаллов</div><div class="value" id="множитель-1">x1</div></div>
        </div>

        <div class="печенька-зона"><div id="объект-клика">🍪</div></div>

        <div class="вкладки">
            <button class="вкладка активна" data-мир="1" data-вкладка="ручная">🖱️ Клик</button>
            <button class="вкладка" data-мир="1" data-вкладка="авто">⚙️ Авто</button>
            <button class="вкладка" data-мир="1" data-вкладка="синергия">✨ Синергия</button>
        </div>

        <div class="вкладка-содержимое активна" data-мир="1" data-вкладка="ручная" id="у-1-ручная"></div>
        <div class="вкладка-содержимое" data-мир="1" data-вкладка="авто" id="у-1-авто"></div>
        <div class="вкладка-содержимое" data-мир="1" data-вкладка="синергия" id="у-1-синергия"></div>
    </div>

    <!-- МИР 2 -->
    <div id="мир-2" style="display:none;">
        <div class="статистика">
            <div class="стат-блок"><div class="label">Кристаллы</div><div class="value" id="счёт-2">0</div></div>
            <div class="стат-блок"><div class="label">В секунду</div><div class="value" id="сек-2">0</div></div>
            <div class="стат-блок"><div class="label">Бонус к Печенькам</div><div class="value" id="клик-2">x1</div></div>
            <div class="стат-блок"><div class="label">За клик</div><div class="value" id="кристалл-клик">1</div></div>
        </div>

        <div class="печенька-зона"><div id="объект-клика-2">💎</div></div>

        <div class="вкладки">
            <button class="вкладка активна" data-мир="2" data-вкладка="ручная">🖱️ Клик</button>
            <button class="вкладка" data-мир="2" data-вкладка="авто">⚙️ Авто</button>
            <button class="вкладка" data-мир="2" data-вкладка="синергия">✨ Глобальные</button>
        </div>

        <div class="вкладка-содержимое активна" data-мир="2" data-вкладка="ручная" id="у-2-ручная"></div>
        <div class="вкладка-содержимое" data-мир="2" data-вкладка="авто" id="у-2-авто"></div>
        <div class="вкладка-содержимое" data-мир="2" data-вкладка="синергия" id="у-2-синергия"></div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="вкладка" style="background:#38a169; color:white;" id="btn-сохранить">💾 Сохранить</button>
        <button class="вкладка" style="background:#805ad5; color:white;" id="btn-загрузить">📂 Загрузить</button>
    </div>

    <button class="кнопка-сброс" id="кнопкаСброса">🗑️ Сбросить всё</button>

    <div class="модалка" id="модалка">
        <div class="модалка-контент">
            <h2 id="модалка-заголовок">Сохранение</h2>
            <textarea id="модалка-текст" placeholder="Тут будет код..."></textarea>
            <button class="вкладка" style="background:#4299e1; color:white; width:100%;" id="модалка-действие">Подтвердить</button>
            <button class="вкладка" style="background:#e53e3e; color:white; width:100%; margin-top:8px;" id="модалка-закрыть">Закрыть</button>
        </div>
    </div>

    <div class="уведомление" id="уведомление"></div>

    <script>
        // 1. СЕКРЕТНЫЙ КЛЮЧ
        const _k = [71, 51, 110, 48, 95, 67, 108, 49, 99, 107, 95, 87, 52, 114, 95, 50, 48, 50, 54]; 
        const СЕКРЕТ = _k.map(c => String.fromCharCode(c)).join('');

        function хэш(строка) {
            let h = 5381;
            for (let i = 0; i < строка.length; i++) {
                h = ((h << 5) + h) + строка.charCodeAt(i);
                h = h & 0xffffffff;
            }
            return (h >>> 0).toString(16);
        }

        // 2. СОСТОЯНИЕ
        let печеньки = 0, кристаллы = 0;
        let всегоКликов = 0;
        
        // Множители
        let множительКликМир1 = 1;
        let множительАвтоМир1 = 1;
        let множительКристаллДобыча = 1; // Глобальный для мира 2
        let множительПеченькиОтКристаллов = 1; // Влияние мира 2 на мир 1

        let последнийКлик1 = 0, последнийКлик2 = 0;
        let открытМир2 = false;

        // 3. УЛУЧШЕНИЯ (ОГРОМНЫЙ СПИСОК)
        const У1 = {
            ручная: [
                { назв: 'Крепкий палец', опис: '+1', база: 15, шаг: 15, бонус: 1, куплено: 0 },
                { назв: 'Ловкая рука', опис: '+5', база: 100, шаг: 100, бонус: 5, куплено: 0 },
                { назв: 'Магическая перчатка', опис: '+25', база: 500, шаг: 500, бонус: 25, куплено: 0 },
                { назв: 'Мультипалец', опис: '+100', база: 5000, шаг: 5000, бонус: 100, куплено: 0 },
                { назв: 'Рука богов', опис: '+500', база: 50000, шаг: 50000, бонус: 500, куплено: 0 },
                { назв: 'Титаническая длань', опис: '+2500', база: 500000, шаг: 500000, бонус: 2500, куплено: 0 }
            ],
            авто: [
                { назв: 'Бабушка', опис: '+1', база: 50, шаг: 50, бонус: 1, куплено: 0 },
                { назв: 'Пекарня', опис: '+5', база: 500, шаг: 500, бонус: 5, куплено: 0 },
                { назв: 'Фабрика', опис: '+25', база: 5000, шаг: 5000, бонус: 25, куплено: 0 },
                { назв: 'Завод', опис: '+100', база: 50000, шаг: 50000, бонус: 100, куплено: 0 },
                { назв: 'Корпорация', опис: '+500', база: 500000, шаг: 500000, бонус: 500, куплено: 0 },
                { назв: 'Империя', опис: '+2500', база: 5000000, шаг: 5000000, бонус: 2500, куплено: 0 }
            ],
            синергия: [
                { назв: 'Золотая печенька', опис: '×2 к клику', база: 100000, шаг: 100000, тип: 'мк', зн: 2, куплено: 0 },
                { назв: 'Ускорение', опис: '×2 к авто', база: 1000000, шаг: 1000000, тип: 'ма', зн: 2, куплено: 0 },
                { назв: 'Кристалл', опис: '×3 к клику', база: 10000000, шаг: 10000000, тип: 'мк', зн: 3, куплено: 0 },
                { назв: 'Ядро', опис: '×3 к авто', база: 100000000, шаг: 100000000, тип: 'ма', зн: 3, куплено: 0 }
            ]
        };

        const У2 = {
            ручная: [
                { назв: 'Осколок', опис: '+1', база: 10, шаг: 10, бонус: 1, куплено: 0 },
                { назв: 'Кристалл', опис: '+10', база: 200, шаг: 200, бонус: 10, куплено: 0 },
                { назв: 'Друза', опис: '+50', база: 5000, шаг: 5000, бонус: 50, куплено: 0 }
            ],
            авто: [
                { назв: 'Шахта', опис: '+1', база: 100, шаг: 100, бонус: 1, куплено: 0 },
                { назв: 'Дракон', опис: '+10', база: 2000, шаг: 2000, бонус: 10, куплено: 0 }
            ],
            синергия: [
                { назв: 'Связь миров', опис: '×2 к печенькам', база: 10000, шаг: 10000, тип: 'печеньки', зн: 2, куплено: 0 },
                { назв: 'Абсолют', опис: '×5 к печенькам', база: 1000000, шаг: 1000000, тип: 'печеньки', зн: 5, куплено: 0 }
            ]
        };

        // 4. ЛОГИКА
        function формат(ч) {
            if (ч < 1000) return Math.floor(ч).toString();
            const с = [ {п:1e3,с:' тыс.'}, {п:1e6,с:' млн'}, {п:1e9,с:' млрд'}, {п:1e12,с:' трлн'}, {п:1e15,с:' квдр'} ];
            for (let i = с.length - 1; i >= 0; i--) {
                if (ч >= с[i].п) return (ч / с[i].п).toFixed(1) + с[i].с;
            }
            return Math.floor(ч).toString();
        }

        function ценаУ(у) { return у.база + (у.куплено * у.шаг); }

        // Стоимость клика в мире 1
        function заКлик1() {
            let б = 1;
            У1.ручная.forEach(у => б += у.бонус * у.куплено);
            return б * множительКликМир1 * множительПеченькиОтКристаллов;
        }
        function вСекунду1() {
            let б = 0;
            У1.авто.forEach(у => б += у.бонус * у.куплено);
            return б * множительАвтоМир1 * множительПеченькиОтКристаллов;
        }

        // Стоимость клика в мире 2
        function заКлик2() {
            let б = 1;
            У2.ручная.forEach(у => б += у.бонус * у.куплено);
            return б * множительКристаллДобыча;
        }
        function вСекунду2() {
            let б = 0;
            У2.авто.forEach(у => б += у.бонус * у.куплено);
            return б * множительКристаллДобыча;
        }

        // 5. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА
        function обновить() {
            document.getElementById('счёт-1').textContent = формат(печеньки);
            document.getElementById('сек-1').textContent = формат(вСекунду1());
            document.getElementById('клик-1').textContent = формат(заКлик1());
            document.getElementById('множитель-1').textContent = 'x' + множительПеченькиОтКристаллов;

            document.getElementById('счёт-2').textContent = формат(кристаллы);
            document.getElementById('сек-2').textContent = формат(вСекунду2());
            document.getElementById('клик-2').textContent = 'x' + множительПеченькиОтКристаллов;
            document.getElementById('кристалл-клик').textContent = формат(заКлик2());

            рисоватьУлучшения(1, У1.ручная, 'у-1-ручная', 'печеньки');
            рисоватьУлучшения(1, У1.авто, 'у-1-авто', 'печеньки');
            рисоватьУлучшения(1, У1.синергия, 'у-1-синергия', 'печеньки');

            рисоватьУлучшения(2, У2.ручная, 'у-2-ручная', 'кристаллы');
            рисоватьУлучшения(2, У2.авто, 'у-2-авто', 'кристаллы');
            рисоватьУлучшения(2, У2.синергия, 'у-2-синергия', 'кристаллы');
            
            // Проверка на открытие портала
            if (!открытМир2 && печеньки >= 10000000) {
                открытМир2 = true;
                document.getElementById('btn-мир-2').disabled = false;
                document.getElementById('btn-мир-2').style.opacity = '1';
                показатьУведомление('Портал открыт!');
            }
            if (!открытМир2) {
                document.getElementById('btn-мир-2').disabled = true;
                document.getElementById('btn-мир-2').style.opacity = '0.5';
                document.getElementById('btn-мир-2').textContent = '🔒 Портал (10 млн)';
            }
        }

        function рисоватьУлучшения(мир, список, ид, валюта) {
            const конт = document.getElementById(ид);
            if (!конт) return;
            конт.innerHTML = '';
            const баланс = валюта === 'печеньки' ? печеньки : кристаллы;
            
            список.forEach(у => {
                const ц = ценаУ(у);
                const дост = баланс >= ц;
                const div = document.createElement('div');
                div.className = 'улучшение ' + (дост ? 'доступно' : 'недоступно');
                div.innerHTML = `<div><div class="назв">${у.назв}</div><div class="опис">${у.опис}</div></div>
                                 <div class="цена">${валюта==='печеньки'?'🍪':'💎'} ${формат(ц)}<br><span style="font-size:10px;color:#718096;">Куплено: ${у.куплено}</span></div>`;
                if (дост) div.onclick = () => купить(мир, у);
                конт.appendChild(div);
            });
        }

        function купить(мир, у) {
            const ц = ценаУ(у);
            if (мир === 1) {
                if (печеньки < ц) return;
                печеньки -= ц;
                у.куплено++;
                if (у.тип === 'мк') множительКликМир1 *= у.зн;
                if (у.тип === 'ма') множительАвтоМир1 *= у.зн;
            } else {
                if (кристаллы < ц) return;
                кристаллы -= ц;
                у.куплено++;
                if (у.тип === 'печеньки') множительПеченькиОтКристаллов *= у.зн;
            }
            показатьУведомление(`Куплено: ${у.назв}`);
            обновить();
        }

        // 6. КЛИКИ
        document.getElementById('объект-клика').addEventListener('click', () => {
            const с = Date.now();
            if (с - последнийКлик1 < 50) return;
            последнийКлик1 = с;
            печеньки += заКлик1();
            всегоКликов++;
            обновить();
        });

        document.getElementById('объект-клика-2').addEventListener('click', () => {
            const с = Date.now();
            if (с - последнийКлик2 < 50) return;
            последнийКлик2 = с;
            кристаллы += заКлик2();
            обновить();
        });

        // 7. АВТОДОХОД
        setInterval(() => {
            const п1 = вСекунду1();
            const п2 = вСекунду2();
            if (п1 > 0 || п2 > 0) {
                печеньки += п1;
                кристаллы += п2;
                обновить();
            }
        }, 1000);

        // 8. ИНТЕРФЕЙС
        document.getElementById('btn-мир-1').onclick = () => {
            document.getElementById('мир-1').style.display = 'block';
            document.getElementById('мир-2').style.display = 'none';
            document.getElementById('btn-мир-1').className = 'мир-кнопка активен-1';
            document.getElementById('btn-мир-2').className = 'мир-кнопка';
        };

        document.getElementById('btn-мир-2').onclick = () => {
            if (!открытМир2) return;
            document.getElementById('мир-1').style.display = 'none';
            document.getElementById('мир-2').style.display = 'block';
            document.getElementById('btn-мир-1').className = 'мир-кнопка';
            document.getElementById('btn-мир-2').className = 'мир-кнопка активен-2';
        };

        document.querySelectorAll('.вкладка[data-мир]').forEach(вкл => {
            вкл.addEventListener('click', function() {
                const м = this.dataset.мир;
                const к = this.dataset.вкладка;
                document.querySelectorAll(`.вкладка[data-мир="${м}"]`).forEach(в => в.classList.remove('активна'));
                document.querySelectorAll(`.вкладка-содержимое[data-мир="${м}"]`).forEach(с => с.classList.remove('активна'));
                this.classList.add('активна');
                document.querySelector(`.вкладка-содержимое[data-мир="${м}"][data-вкладка="${к}"]`).classList.add('активна');
            });
        });

        // 9. УВЕДОМЛЕНИЯ
        let тм;
        function показатьУведомление(т) {
            const у = document.getElementById('уведомление');
            у.textContent = т;
            у.classList.add('активно');
            clearTimeout(тм);
            тм = setTimeout(() => у.classList.remove('активно'), 2000);
        }

        // 10. СОХРАНЕНИЕ
        const модалка = document.getElementById('модалка');
        const мТекст = document.getElementById('модалка-текст');
        const мЗаголовок = document.getElementById('модалка-заголовок');
        const мДействие = document.getElementById('модалка-действие');
        let режим = 'сохр';

        document.getElementById('btn-сохранить').onclick = () => {
            режим = 'сохр';
            мЗаголовок.textContent = 'Код сохранения';
            const д = {
                п: Math.floor(печеньки), к: Math.floor(кристаллы), вк: всегоКликов,
                м1: множительКликМир1, м2: множительАвтоМир1,
                м3: множительКристаллДобыча, м4: множительПеченькиОтКристаллов,
                о: открытМир2 ? 1 : 0,
                у1: { р: У1.ручная.map(x=>x.куплено), а: У1.авто.map(x=>x.куплено), с: У1.синергия.map(x=>x.куплено) },
                у2: { р: У2.ручная.map(x=>x.куплено), а: У2.авто.map(x=>x.куплено), с: У2.синергия.map(x=>x.куплено) }
            };
            const стр = JSON.stringify(д);
            const подп = хэш(стр + СЕКРЕТ);
            мТекст.value = btoa(unescape(encodeURIComponent(стр))) + '.' + подп;
            мДействие.textContent = 'Скопировать';
            модалка.classList.add('активна');
        };

        document.getElementById('btn-загрузить').onclick = () => {
            режим = 'загр';
            мЗаголовок.textContent = 'Вставь код';
            мТекст.value = '';
            мДействие.textContent = 'Загрузить';
            модалка.classList.add('активна');
        };

        мДействие.onclick = () => {
            if (режим === 'сохр') {
                мТекст.select();
                document.execCommand('copy');
                показатьУведомление('Скопировано!');
                модалка.classList.remove('активна');
            } else {
                try {
                    const ч = мТекст.value.trim().split('.');
                    if (ч.length !== 2) throw new Error('Формат');
                    const стр = decodeURIComponent(escape(atob(ч[0])));
                    if (хэш(стр + СЕКРЕТ) !== ч[1]) throw new Error('Подпись не совпадает! Сейв взломан.');
                    const д = JSON.parse(стр);
                    
                    печеньки = д.п; кристаллы = д.к; всегоКликов = д.вк;
                    множительКликМир1 = д.м1; множительАвтоМир1 = д.м2;
                    множительКристаллДобыча = д.м3; множительПеченькиОтКристаллов = д.м4;
                    открытМир2 = д.о === 1;
                    
                    д.у1.р.forEach((v,i)=>У1.ручная[i].куплено=v);
                    д.у1.а.forEach((v,i)=>У1.авто[i].куплено=v);
                    д.у1.с.forEach((v,i)=>У1.синергия[i].куплено=v);
                    д.у2.р.forEach((v,i)=>У2.ручная[i].куплено=v);
                    д.у2.а.forEach((v,i)=>У2.авто[i].куплено=v);
                    д.у2.с.forEach((v,i)=>У2.синергия[i].куплено=v);
                    
                    обновить();
                    показатьУведомление('Загружено!');
                    модалка.classList.remove('активна');
                } catch(e) { alert('❌ ' + e.message); }
            }
        };

        document.getElementById('модалка-закрыть').onclick = () => модалка.classList.remove('активна');
        document.getElementById('кнопкаСброса').onclick = () => {
            if (confirm('Сбросить ВСЁ?')) location.reload();
        };

        обновить();
    </script>
</body>
</html>
