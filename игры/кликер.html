<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кликер 9.0 - Мультивселенная</title>
    <link rel="icon" href="../ico.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; user-select: none; -webkit-user-select: none; }

        .мир-переключатель { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .мир-кнопка { flex: 1 1 30%; background: #1a202c; color: #718096; border: 2px solid #2d3748; padding: 8px 2px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 13px; }
        .мир-кнопка:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .мир-кнопка.активен-1 { background: #744210; color: #f6e05e; border-color: #d69e2e; }
        .мир-кнопка.активен-2 { background: #2a4365; color: #90cdf4; border-color: #4299e1; }
        .мир-кнопка.активен-3 { background: #44337a; color: #e9d8fd; border-color: #805ad5; }
        .мир-кнопка.активен-4 { background: #742a2a; color: #feb2b2; border-color: #e53e3e; }
        .мир-кнопка.активен-5 { background: #22543d; color: #9ae6b4; border-color: #48bb78; }
        .мир-кнопка.активен-6 { background: #7b341e; color: #fbd38d; border-color: #ed8936; }
        .мир-кнопка.активен-7 { background: #44337a; color: #d6bcfa; border-color: #9f7aea; }
        .мир-кнопка.активен-8 { background: #2c5282; color: #bee3f8; border-color: #63b3ed; }
        .мир-кнопка.активен-9 { background: #1a202c; color: #ffffff; border-color: #e2e8f0; box-shadow: 0 0 15px rgba(255,255,255,0.5); }

        .печенька-зона { display: flex; justify-content: center; margin: 20px 0; position: relative; height: 140px; align-items: center; }
        #объект-клика { font-size: 100px; cursor: pointer; transition: transform 0.05s; text-shadow: 0 0 20px rgba(246, 224, 94, 0.4); z-index: 2; position: relative; }
        #объект-клика:active { transform: scale(0.9); }

        .вылетающая-цифра {
            position: absolute; color: #f6e05e; font-weight: 900; font-size: 24px; pointer-events: none;
            animation: улетает 0.8s ease-out forwards; z-index: 10; text-shadow: 0 0 4px black, 0 0 8px black; white-space: nowrap;
        }

        @keyframes улетает {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        .статистика { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .стат-блок { background: #1a202c; border: 1px solid #2d3748; padding: 12px; border-radius: 10px; text-align: center; }
        .стат-блок .label { color: #718096; font-size: 12px; }
        .стат-блок .value { color: #f6e05e; font-size: 20px; font-weight: 700; }

        .вкладки { display: flex; gap: 6px; margin-bottom: 16px; }
        .вкладка { flex: 1; background: #2d3748; color: #a0aec0; border: none; padding: 10px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s; }
        .вкладка.активна { background: #4299e1; color: white; }

        .улучшение { display: flex; justify-content: space-between; align-items: center; background: #1a202c; border: 1px solid #2d3748; padding: 12px 16px; border-radius: 10px; transition: all 0.2s; margin-bottom: 8px; }
        .улучшение.доступно { cursor: pointer; border-color: #38a169; }
        .улучшение.доступно:hover { background: #2d3748; }
        .улучшение.недоступно { opacity: 0.5; cursor: not-allowed; }
        .улучшение .назв { color: #90cdf4; font-weight: 600; font-size: 15px; }
        .улучшение .опис { color: #718096; font-size: 12px; margin-top: 2px; }
        .улучшение .цена { color: #f6e05e; font-weight: 700; font-size: 14px; text-align: right; }
        
        .вкладка-содержимое { display: none; }
        .вкладка-содержимое.активна { display: block; }

        .кнопка-сброс { display: block; width: 100%; margin-top: 30px; background: transparent; color: #e53e3e; border: 1px solid #e53e3e; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .кнопка-сброс:hover { background: #e53e3e; color: white; }

        .кнопки-сохранения { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .кнопка-сейва { flex: 1; min-width: 120px; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-family: inherit; font-size: 14px; transition: all 0.2s; }
        .кнопка-сейва.сохр { background: #38a169; color: white; }
        .кнопка-сейва.загр { background: #805ad5; color: white; }

        .уведомление { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #38a169; color: white; padding: 10px 20px; border-radius: 20px; font-weight: 600; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .уведомление.активно { opacity: 1; }

        /* КАПЧА */
        .капча-фон { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; }
        .капча-фон.активна { display: flex; }
        .капча-топ { height: 25vh; display: flex; justify-content: center; align-items: center; padding: 10px; pointer-events: none; }
        .капча-вопрос { color: white; font-size: 22px; font-weight: 700; text-align: center; background: #1a202c; padding: 15px 20px; border-radius: 12px; border: 2px solid #e53e3e; white-space: nowrap; max-width: 95vw; overflow: hidden; text-overflow: ellipsis; }
        .капча-низ { flex-grow: 1; position: relative; pointer-events: auto; margin-bottom: 50px; }
        .капча-ответ { position: absolute; padding: 15px 25px; font-size: 22px; font-weight: 700; background: #38a169; color: white; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); min-width: 70px; text-align: center; }
        .капча-ответ:hover { background: #2f855a; }
    </style>
</head>
<body>
    <div class="header">
        <a href="../игры.html" class="back-btn">← Назад</a>
        <span class="badge purple">🖱️ Кликер 9.0</span>
    </div>

    <h1>🍪 Кликер 9.0 (Мультивселенная)</h1>

    <div class="мир-переключатель" id="мир-переключатель"></div>
    <div id="мир-контейнер"></div>

    <div class="кнопки-сохранения">
        <button class="кнопка-сейва сохр" id="btn-сохранить">💾 Скачать сейв</button>
        <button class="кнопка-сейва загр" id="btn-загрузить">📂 Загрузить сейв</button>
        <input type="file" id="файл-загрузки" accept=".txt" style="display:none;">
    </div>

    <button class="кнопка-сброс" id="кнопкаСброса">🗑️ Полный сброс</button>
    <div class="уведомление" id="уведомление"></div>

    <div class="капча-фон" id="капча-фон">
        <div class="капча-топ">
            <div class="капча-вопрос" id="капча-вопрос">2 + 2 = ?</div>
        </div>
        <div class="капча-низ" id="капча-низ"></div>
    </div>

    <script>
        const _k = [71, 51, 110, 48, 95, 67, 108, 49, 99, 107, 95, 87, 52, 114, 95, 50, 48, 50, 54, 95, 53, 48];
        const СЕКРЕТ = _k.map(c => String.fromCharCode(c)).join('');

        function хэш(строка) {
            let h = 5381;
            for (let i = 0; i < строка.length; i++) {
                h = ((h << 5) + h) + строка.charCodeAt(i);
                h = h & 0xffffffff;
            }
            return (h >>> 0).toString(16);
        }

        const МИРЫ = [
            { id: 1, эмодзи: '🍪', ценаВхода: 0 },
            { id: 2, эмодзи: '💎', ценаВхода: 1e6 },
            { id: 3, эмодзи: '🥟', ценаВхода: 1e9 },
            { id: 4, эмодзи: '🍕', ценаВхода: 1e12 },
            { id: 5, эмодзи: '🍔', ценаВхода: 1e15 },
            { id: 6, эмодзи: '🍩', ценаВхода: 1e18 },
            { id: 7, эмодзи: '🍫', ценаВхода: 1e21 },
            { id: 8, эмодзи: '🍿', ценаВхода: 1e24 },
            { id: 9, эмодзи: '🍽️', ценаВхода: 1e27 }
        ];

        let печеньки = 0;
        let текущийМир = 1;
        
        // ГЛОБАЛЬНЫЙ МНОЖИТЕЛЬ (влияет на всё)
        let глобальныйМножитель = 1; 
        
        // Базовые показатели (до умножения)
        let базовыйКлик = 1;
        let базовоеАвто = 0;

        // Для миров
        let историяКликов = [];
        let подозрительныеКлики = 0;
        let заблокирован = false;
        let последнийКлик = 0;

        // Улучшения для каждого мира
        let У1 = {
    ручная: [
        { назв: 'Крепкий палец', опис: '+1', база: 10, шаг: 12, бонус: 1, куплено: 0 },
        { назв: 'Ловкая рука', опис: '+5', база: 100, шаг: 120, бонус: 5, куплено: 0 },
        { назв: 'Магическая перчатка', опис: '+25', база: 1000, шаг: 1200, бонус: 25, куплено: 0 },
        { назв: 'Мультипалец', опис: '+100', база: 10000, шаг: 12000, бонус: 100, куплено: 0 },
        { назв: 'Рука богов', опис: '+500', база: 100000, шаг: 120000, бонус: 500, куплено: 0 },
        { назв: 'Титаническая длань', опис: '+2 500', база: 1000000, шаг: 1200000, бонус: 2500, куплено: 0 },
        { назв: 'Космический кулак', опис: '+10 000', база: 10000000, шаг: 12000000, бонус: 10000, куплено: 0 },
        { назв: 'Божественный удар', опис: '+50 000', база: 100000000, шаг: 120000000, бонус: 50000, куплено: 0 },
        { назв: 'Сингулярность', опис: '+250 000', база: 1000000000, шаг: 1200000000, бонус: 250000, куплено: 0 },
        { назв: 'Взрыв сверхновой', опис: '+1 000 000', база: 10000000000, шаг: 12000000000, бонус: 1000000, куплено: 0 }
    ],
    авто: [
        { назв: 'Бабушка', опис: '+1/сек', база: 50, шаг: 60, бонус: 1, куплено: 0 },
        { назв: 'Пекарня', опис: '+5/сек', база: 500, шаг: 600, бонус: 5, куплено: 0 },
        { назв: 'Фабрика', опис: '+25/сек', база: 5000, шаг: 6000, бонус: 25, куплено: 0 },
        { назв: 'Завод', опис: '+100/сек', база: 50000, шаг: 60000, бонус: 100, куплено: 0 },
        { назв: 'Корпорация', опис: '+500/сек', база: 500000, шаг: 600000, бонус: 500, куплено: 0 },
        { назв: 'Империя', опис: '+2 500/сек', база: 5000000, шаг: 6000000, бонус: 2500, куплено: 0 },
        { назв: 'Галактика', опис: '+10 000/сек', база: 50000000, шаг: 60000000, бонус: 10000, куплено: 0 },
        { назв: 'Вселенная', опис: '+50 000/сек', база: 500000000, шаг: 600000000, бонус: 50000, куплено: 0 },
        { назв: 'Мультивселенная', опис: '+250 000/сек', база: 5000000000, шаг: 6000000000, бонус: 250000, куплено: 0 },
        { назв: 'Абсолют', опис: '+1 000 000/сек', база: 50000000000, шаг: 60000000000, бонус: 1000000, куплено: 0 }
    ],
    синергия: [
        { назв: 'Золотая печенька', опис: '×2 к клику', база: 50000, шаг: 0, тип: 'мк', зн: 2, куплено: 0, макс: 1 },
        { назв: 'Ускорение', опис: '×2 к авто', база: 500000, шаг: 0, тип: 'ма', зн: 2, куплено: 0, макс: 1 },
        { назв: 'Кристаллический сдвиг', опис: '×3 к клику', база: 5000000, шаг: 0, тип: 'мк', зн: 3, куплено: 0, макс: 1 },
        { назв: 'Квантовый скачок', опис: '×5 к авто', база: 50000000, шаг: 0, тип: 'ма', зн: 5, куплено: 0, макс: 1 },
        { назв: 'Синергия вселенной', опис: '×10 к клику', база: 1000000000, шаг: 0, тип: 'мк', зн: 10, куплено: 0, макс: 1 }
    ]
};

        // Локальные множители от синергии
        let множительКликМир1 = 1;
        let множительАвтоМир1 = 1;

        // Улучшения для остальных 8 миров (Бусты и Снижение цен)
        let улучшенияМиров = {};
        МИРЫ.forEach((м, i) => {
            if (i === 0) return;
            const множительЦены = Math.pow(1000, i);
            улучшенияМиров[м.id] = {
                ручная: [
                    { назв: 'Осколок', опис: 'Улучшает курс (-10%)', база: 10000 * множительЦены, шаг: 0, тип: 'курс', зн: 0.9, куплено: 0, макс: 5 },
                    { назв: 'Кристалл', опис: 'Улучшает курс (-20%)', база: 100000 * множительЦены, шаг: 0, тип: 'курс', зн: 0.8, куплено: 0, макс: 5 }
                ],
                авто: [
                    { назв: 'Базовый буст', опис: 'Прибавляет +1 к глобальному множителю', база: 100000 * множительЦены, шаг: 100000 * множительЦены, прибавка: 1, куплено: 0, макс: 10 },
                    { назв: 'Мощный буст', опис: 'Прибавляет +5 к глобальному множителю', база: 1000000 * множительЦены, шаг: 1000000 * множительЦены, прибавка: 5, куплено: 0, макс: 10 }
                ],
                синергия: [
                    { назв: 'Глобальный х2', опис: 'Умножает множитель на 2', база: 5000000 * множительЦены, шаг: 0, тип: 'глоб_мк', зн: 2, куплено: 0, макс: 1 }
                ]
            };
        });

        function формат(ч) {
            if (!isFinite(ч)) return '∞';
            if (ч < 1000) {
                if (ч > 0 && ч < 1) return ч.toFixed(2);
                return Math.floor(ч).toString();
            }
            const с = [ {п:1e3,с:' тыс.'}, {п:1e6,с:' млн'}, {п:1e9,с:' млрд'}, {п:1e12,с:' трлн'}, {п:1e15,с:' квдр'}, {п:1e18,с:' квнт'}, {п:1e21,с:' скст'}, {п:1e24,с:' спт'}, {п:1e27,с:' окт'}, {п:1e30,с:' нон'}, {п:1e33,с:' дец'} ];
            for (let i = с.length - 1; i >= 0; i--) {
                if (ч >= с[i].п) return (ч / с[i].п).toFixed(1) + с[i].с;
            }
            return Math.floor(ч).toString();
        }

        function ценаУ(у) { return у.база + (у.куплено * у.шаг); }
        
        function рассчитатьКлик() {
            let база = 1;
            У1.ручная.forEach(у => база += у.бонус * у.куплено);
            return база * множительКликМир1 * глобальныйМножитель;
        }
        
        function рассчитатьАвто() {
            let база = 0;
            У1.авто.forEach(у => база += у.бонус * у.куплено);
            return база * множительАвтоМир1 * глобальныйМножитель;
        }

        function инициализироватьИнтерфейс() {
            const перекл = document.getElementById('мир-переключатель');
            const конт = document.getElementById('мир-контейнер');
            перекл.innerHTML = '';
            конт.innerHTML = '';

            МИРЫ.forEach(м => {
                const кн = document.createElement('button');
                кн.className = 'мир-кнопка';
                кн.id = 'btn-мир-' + м.id;
                кн.innerHTML = `${м.эмодзи} Мир ${м.id}`;
                кн.onclick = () => переключитьМир(м.id);
                перекл.appendChild(кн);

                const divМир = document.createElement('div');
                divМир.id = 'мир-' + м.id;
                divМир.style.display = 'none';

                divМир.innerHTML = `
                    <div class="статистика">
                        <div class="стат-блок"><div class="label">Печеньки</div><div class="value" id="счёт-${м.id}">0</div></div>
                        <div class="стат-блок"><div class="label">Глоб. множитель</div><div class="value" id="бонус-${м.id}">x${формат(глобальныйМножитель)}</div></div>
                        <div class="стат-блок"><div class="label">За клик</div><div class="value" id="клик-${м.id}">0</div></div>
                        <div class="стат-блок"><div class="label">В секунду</div><div class="value" id="сек-${м.id}">0</div></div>
                    </div>
                `;

                if (м.id === 1) {
                    divМир.innerHTML += `
                        <div class="печенька-зона" id="зона-клика"><div id="объект-клика">🍪</div></div>
                        <div class="вкладки">
                            <button class="вкладка активна" data-мир="1" data-вкладка="ручная">🖱️ Клик</button>
                            <button class="вкладка" data-мир="1" data-вкладка="авто">⚙️ Авто</button>
                            <button class="вкладка" data-мир="1" data-вкладка="синергия">✨ Синергия</button>
                        </div>
                        <div class="вкладка-содержимое активна" data-мир="1" data-вкладка="ручная" id="у-1-ручная"></div>
                        <div class="вкладка-содержимое" data-мир="1" data-вкладка="авто" id="у-1-авто"></div>
                        <div class="вкладка-содержимое" data-мир="1" data-вкладка="синергия" id="у-1-синергия"></div>
                    `;
                } else {
                    divМир.innerHTML += `
                        <div class="печенька-зона"><div style="font-size:100px; text-shadow: 0 0 20px rgba(246,224,94,0.4);">${м.эмодзи}</div></div>
                        <div class="вкладки">
                            <button class="вкладка активна" data-мир="${м.id}" data-вкладка="ручная">💎 Курс</button>
                            <button class="вкладка" data-мир="${м.id}" data-вкладка="авто">🌌 Бусты</button>
                            <button class="вкладка" data-мир="${м.id}" data-вкладка="синергия">✨ Множители</button>
                        </div>
                        <div class="вкладка-содержимое активна" data-мир="${м.id}" data-вкладка="ручная" id="у-${м.id}-ручная"></div>
                        <div class="вкладка-содержимое" data-мир="${м.id}" data-вкладка="авто" id="у-${м.id}-авто"></div>
                        <div class="вкладка-содержимое" data-мир="${м.id}" data-вкладка="синергия" id="у-${м.id}-синергия"></div>
                    `;
                }
                конт.appendChild(divМир);
            });

            const зонаКлика = document.getElementById('зона-клика');
            if (зонаКлика) {
                document.getElementById('объект-клика').addEventListener('click', (e) => {
                    if (!e.isTrusted || заблокирован || текущийМир !== 1) return;

                    const сейчас = Date.now();
                    if (сейчас - последнийКлик < 50) {
                        подозрительныеКлики++;
                        if (подозрительныеКлики > 10) показатьКапчу();
                        return;
                    }
                    последнийКлик = сейчас;

                    историяКликов.push(сейчас);
                    if (историяКликов.length > 1) {
                        const разница = сейчас - историяКликов[историяКликов.length - 2];
                        if (разница === 50 || разница === 100 || разница === 10) подозрительныеКлики += 2;
                    }
                    while (историяКликов.length > 0 && историяКликов[0] < сейчас - 1000) {
                        историяКликов.shift();
                    }
                    if (историяКликов.length > 15) подозрительныеКлики++;
                    if (подозрительныеКлики >= 15) {
                        показатьКапчу();
                        return;
                    }

                    const прибавка = рассчитатьКлик();
                    печеньки += прибавка;
                    
                    const rect = зонаКлика.getBoundingClientRect();
                    создатьЦифру(e.clientX - rect.left - 20, e.clientY - rect.top - 20, формат(прибавка));
                    обновить();
                });
            }

            // Вкладки
            document.querySelectorAll('.вкладка[data-мир]').forEach(вкл => {
                вкл.addEventListener('click', function() {
                    const м = this.dataset.мир;
                    const к = this.dataset.вкладка;
                    document.querySelectorAll(`.вкладка[data-мир="${м}"]`).forEach(в => в.classList.remove('активна'));
                    document.querySelectorAll(`.вкладка-содержимое[data-мир="${м}"]`).forEach(с => с.classList.remove('активна'));
                    this.classList.add('активна');
                    document.getElementById(`у-${м}-${к}`).classList.add('активна');
                });
            });
        }

        function переключитьМир(id) {
            текущийМир = id;
            МИРЫ.forEach(м => {
                document.getElementById('мир-' + м.id).style.display = (м.id === id) ? 'block' : 'none';
                const btn = document.getElementById('btn-мир-' + м.id);
                btn.className = (м.id === id) ? 'мир-кнопка активен-' + м.id : 'мир-кнопка';
            });
            обновить();
        }

        function купить(мирId, тип, индекс) {
            let у;
            if (мирId === 1) {
                у = У1[тип][индекс];
            } else {
                у = улучшенияМиров[мирId][тип][индекс];
            }
            
            if (у.макс && у.куплено >= у.макс) return;
            const цена = ценаУ(у);
            if (печеньки < цена) return;
            
            печеньки -= цена;
            у.куплено++;
            
            // Применяем эффекты
            if (мирId === 1) {
                if (у.тип === 'мк') множительКликМир1 *= у.зн;
                if (у.тип === 'ма') множительАвтоМир1 *= у.зн;
            } else {
                if (у.прибавка) глобальныйМножитель += у.прибавка;
                if (у.тип === 'глоб_мк') глобальныйМножитель *= у.зн;
            }

            показатьУведомление(`Куплено: ${у.назв}`);
            обновить();
            сохранитьВПамять();
        }

        function обновить() {
            МИРЫ.forEach(м => {
                const элСчёт = document.getElementById('счёт-' + м.id);
                if (элСчёт) элСчёт.textContent = формат(печеньки);
                
                const элБонус = document.getElementById('бонус-' + м.id);
                if (элБонус) элБонус.textContent = 'x' + формат(глобальныйМножитель);

                const элКлик = document.getElementById('клик-' + м.id);
                if (элКлик) элКлик.textContent = формат(рассчитатьКлик());

                const элСек = document.getElementById('сек-' + м.id);
                if (элСек) элСек.textContent = формат(рассчитатьАвто());

                const btn = document.getElementById('btn-мир-' + м.id);
                if (btn) btn.disabled = (печеньки < м.ценаВхода && м.id !== 1);
            });

            if (текущийМир === 1) {
                рисоватьСписок(У1.ручная, 'у-1-ручная', 1, 'ручная');
                рисоватьСписок(У1.авто, 'у-1-авто', 1, 'авто');
                рисоватьСписок(У1.синергия, 'у-1-синергия', 1, 'синергия');
            } else {
                const ум = улучшенияМиров[текущийМир];
                рисоватьСписок(ум.ручная, `у-${текущийМир}-ручная`, текущийМир, 'ручная');
                рисоватьСписок(ум.авто, `у-${текущийМир}-авто`, текущийМир, 'авто');
                рисоватьСписок(ум.синергия, `у-${текущийМир}-синергия`, текущийМир, 'синергия');
            }
        }

        function рисоватьСписок(список, ид, мирId, тип) {
            const конт = document.getElementById(ид);
            if (!конт) return;
            конт.innerHTML = '';
            
            список.forEach((у, i) => {
                if (у.макс && у.куплено >= у.макс) return;
                
                const цена = ценаУ(у);
                const дост = печеньки >= цена;
                
                const div = document.createElement('div');
                div.className = 'улучшение ' + (дост ? 'доступно' : 'недоступно');
                
                div.innerHTML = `
                    <div>
                        <div class="назв">${у.назв}</div>
                        <div class="опис">${у.опис}</div>
                    </div>
                    <div class="цена">
                        🍪 ${формат(цена)}<br>
                        <span style="font-size:10px;color:#718096;">Куплено: ${у.куплено}${у.макс?'/'+у.макс:''}</span>
                    </div>
                `;
                
                if (дост) div.onclick = () => купить(мирId, тип, i);
                конт.appendChild(div);
            });
            if (конт.innerHTML === '') конт.innerHTML = '<div style="text-align:center;color:#718096;padding:20px;">Все куплено!</div>';
        }

        // Антиклик и капча (без изменений)
        function создатьЦифру(x, y, текст) {
            const div = document.createElement('div');
            div.className = 'вылетающая-цифра';
            div.textContent = '+' + текст;
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            document.getElementById('зона-клика').appendChild(div);
            setTimeout(() => div.remove(), 800);
        }

        let текущийВопрос = 0;
        function показатьКапчу() {
            заблокирован = true; подозрительныеКлики = 0; историяКликов = []; текущийВопрос = 0;
            document.getElementById('капча-фон').classList.add('активна');
            сгенерироватьВопрос();
        }

        function сгенерироватьВопрос() {
            if (текущийВопрос >= 3) {
                заблокирован = false;
                document.getElementById('капча-фон').classList.remove('активна');
                document.querySelectorAll('.капча-ответ').forEach(b => b.remove());
                показатьУведомление('Проверка пройдена! Ты человек.');
                return;
            }
            document.querySelectorAll('.капча-ответ').forEach(b => b.remove());
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            let вопрос, ответ;
            if (Math.random() > 0.5) { вопрос = `${a} + ${b}`; ответ = a + b; }
            else { if (a < b) { вопрос = `${b} - ${a}`; ответ = b - a; } else { вопрос = `${a} - ${b}`; ответ = a - b; } }

            document.getElementById('капча-вопрос').textContent = `Вопрос ${текущийВопрос + 1}/3: ${вопрос} = ?`;
            const варианты = [ответ];
            while (варианты.length < 3) {
                const ложь = ответ + Math.floor(Math.random() * 10) - 5;
                if (ложь !== ответ && ложь >= 0 && !варианты.includes(ложь)) варианты.push(ложь);
            }
            варианты.sort(() => Math.random() - 0.5);

            const контейнер = document.getElementById('капча-низ');
            варианты.forEach(число => {
                const btn = document.createElement('button');
                btn.className = 'капча-ответ';
                btn.textContent = число;
                переместитьКнопку(btn, контейнер);
                btn.onclick = (e) => {
                    if (!e.isTrusted) return;
                    if (число === ответ) { текущийВопрос++; сгенерироватьВопрос(); }
                    else { показатьУведомление('❌ Неправильно! Начинаем заново.'); текущийВопрос = 0; сгенерироватьВопрос(); }
                };
                btn.addEventListener('mouseenter', () => переместитьКнопку(btn, контейнер));
                контейнер.appendChild(btn);
            });
        }

        function переместитьКнопку(btn, контейнер) {
            const rect = контейнер.getBoundingClientRect();
            btn.style.left = Math.max(10, Math.random() * (rect.width - 100)) + 'px';
            btn.style.top = Math.max(10, Math.random() * (rect.height - 60)) + 'px';
        }

        let тм;
        function показатьУведомление(т) {
            const у = document.getElementById('уведомление');
            у.textContent = т; у.classList.add('активно');
            clearTimeout(тм); тм = setTimeout(() => у.classList.remove('активно'), 2000);
        }

        const КЛЮЧ_СЕЙВА = 'кликер_9_0_сейв';

        function собратьДанные() {
            return {
                п: печеньки, 
                гм: глобальныйМножитель,
                мк: множительКликМир1, 
                ма: множительАвтоМир1,
                м1: { р: У1.ручная.map(x=>x.куплено), а: У1.авто.map(x=>x.куплено), с: У1.синергия.map(x=>x.куплено) },
                у: улучшенияМиров
            };
        }

        function сохранитьВПамять() {
            const д = собратьДанные(); const стр = JSON.stringify(д); const подп = хэш(стр + СЕКРЕТ);
            localStorage.setItem(КЛЮЧ_СЕЙВА, btoa(unescape(encodeURIComponent(стр))) + '.' + подп);
        }

        function применитьДанные(д) {
            печеньки = д.п || 0;
            глобальныйМножитель = д.гм || 1;
            множительКликМир1 = д.мк || 1;
            множительАвтоМир1 = д.ма || 1;
            
            if (д.м1) {
                д.м1.р.forEach((v,i)=> { if(У1.ручная[i]) У1.ручная[i].куплено = v; });
                д.м1.а.forEach((v,i)=> { if(У1.авто[i]) У1.авто[i].куплено = v; });
                д.м1.с.forEach((v,i)=> { if(У1.синергия[i]) У1.синергия[i].куплено = v; });
            }
            if (д.у) {
                for (let key in д.у) {
                    if (улучшенияМиров[key]) {
                        // Восстанавливаем ручные, авто и синергии для каждого мира
                        for (let t in улучшенияМиров[key]) {
                            if (д.у[key][t]) {
                                д.у[key][t].forEach((сохрУ, i) => {
                                    if (улучшенияМиров[key][t][i]) улучшенияМиров[key][t][i].куплено = сохрУ.куплено;
                                });
                            }
                        }
                    }
                }
            }
            обновить();
        }

        document.getElementById('btn-сохранить').onclick = () => {
            const д = собратьДанные(); const стр = JSON.stringify(д); const подп = хэш(стр + СЕКРЕТ);
            const код = btoa(unescape(encodeURIComponent(стр))) + '.' + подп;
            const blob = new Blob([код], { type: 'text/plain' }); const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'кликер_сейв.txt'; a.click(); URL.revokeObjectURL(url);
            показатьУведомление('Файл скачан!');
        };

        document.getElementById('btn-загрузить').onclick = () => document.getElementById('файл-загрузки').click();
        document.getElementById('файл-загрузки').onchange = (e) => {
            const файл = e.target.files[0]; if (!файл) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const ч = ev.target.result.replace(/[^\x20-\x7E]/g, '').trim().split('.');
                    if (ч.length !== 2) throw new Error('Формат неверный');
                    const стр = decodeURIComponent(escape(atob(ч[0])));
                    if (хэш(стр + СЕКРЕТ) !== ч[1]) throw new Error('Подпись не совпадает!');
                    применитьДанные(JSON.parse(стр));
                    показатьУведомление('Прогресс загружен!');
                } catch(e) { alert('❌ ' + e.message); }
            };
            reader.readAsText(файл);
        };

        document.getElementById('кнопкаСброса').onclick = () => {
            if (confirm('Полный сброс?')) { localStorage.removeItem(КЛЮЧ_СЕЙВА); location.reload(); }
        };

        (function() {
            инициализироватьИнтерфейс();
            const сейв = localStorage.getItem(КЛЮЧ_СЕЙВА);
            if (сейв) {
                try {
                    const ч = сейв.split('.');
                    if (ч.length === 2) {
                        const стр = decodeURIComponent(escape(atob(ч[0])));
                        if (хэш(стр + СЕКРЕТ) === ч[1]) применитьДанные(JSON.parse(стр));
                    }
                } catch(e) {}
            }
            переключитьМир(1);
            обновить();
            
            setInterval(() => { печеньки += рассчитатьАвто(); обновить(); }, 1000);
            setInterval(сохранитьВПамять, 10000);
        })();
    </script>
</body>
</html>
