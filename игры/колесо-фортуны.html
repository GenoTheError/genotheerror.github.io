<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колесо фортуны</title>
    <link rel="icon" href="../ico.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        .колесо-обёртка {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1;
            margin: 20px auto;
        }
        #колесо {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(66, 153, 225, 0.4), inset 0 0 40px rgba(0,0,0,0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .стрелка {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #f6e05e;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .центр {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #f6e05e;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 20px rgba(246, 224, 94, 0.6);
        }
        
        .кнопка-крутить {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 20px auto;
            background: #4299e1;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .кнопка-крутить:hover {
            background: #3182ce;
        }
        .кнопка-крутить:disabled {
            background: #4a5568;
            cursor: not-allowed;
        }
        
        .результат {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            margin: 16px 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .результат.выигрыш {
            background: #38a169;
            color: white;
            animation: выигрыш 0.6s;
        }
        @keyframes выигрыш {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="../игры.html" class="back-btn">← Назад</a>
        <span class="badge purple">🎲 Удача</span>
    </div>
    
    <h1>🎡 Колесо фортуны</h1>
    
    <div class="колесо-обёртка">
        <div class="стрелка"></div>
        <div class="центр">🎁</div>
        <canvas id="колесо" width="600" height="600"></canvas>
    </div>
    
    <div class="результат" id="результат">Крути колесо!</div>
    
    <button class="кнопка-крутить" id="кнопка">🎡 Крутить!</button>
    
    <script>
    const призы = [
        { текст: '🍪', назв: 'Печенька',     цвет: '#d69e2e' },
        { текст: '⭐', назв: 'Звезда',       цвет: '#4299e1' },
        { текст: '💎', назв: 'Алмаз',        цвет: '#38a169' },
        { текст: '🎁', назв: 'Подарок',      цвет: '#805ad5' },
        { текст: '🍕', назв: 'Пицца',        цвет: '#e53e3e' },
        { текст: '🎮', назв: 'Джойстик',     цвет: '#3182ce' },
        { текст: '🌈', назв: 'Радуга',       цвет: '#ed64a6' },
        { текст: '💯', назв: 'Сотка',        цвет: '#38b2ac' }
    ];
    
    const канвас = document.getElementById('колесо');
    const ctx = канвас.getContext('2d');
    const кнопка = document.getElementById('кнопка');
    const результатЭл = document.getElementById('результат');
    let угол = 0;
    let крутится = false;
    
    function нарисовать() {
        const центр = канвас.width / 2;
        const радиус = центр - 10;
        const сектор = (Math.PI * 2) / призы.length;
        
        ctx.clearRect(0, 0, канвас.width, канвас.height);
        
        призы.forEach((приз, i) => {
            const старт = i * сектор + угол;
            const конец = старт + сектор;
            
            ctx.beginPath();
            ctx.moveTo(центр, центр);
            ctx.arc(центр, центр, радиус, старт, конец);
            ctx.closePath();
            ctx.fillStyle = приз.цвет;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.save();
            ctx.translate(центр, центр);
            ctx.rotate(старт + сектор / 2);
            ctx.textAlign = 'right';
            ctx.font = '60px sans-serif';
            ctx.fillText(приз.текст, радиус - 30, 20);
            ctx.restore();
        });
    }
    
    function крутить() {
        if (крутится) return;
        крутится = true;
        кнопка.disabled = true;
        результатЭл.textContent = '🎡 Крутится...';
        результатЭл.className = 'результат';
        
        const стартовый = угол;
        const цель = угол + (5 + Math.random() * 3) * Math.PI * 2 + Math.random() * Math.PI * 2;
        const длительность = 4000;
        const времяСтарта = performance.now();
        
        function шаг(время) {
            const прошло = время - времяСтарта;
            const t = Math.min(прошло / длительность, 1);
            // Плавное замедление (ease-out cubic)
            const eased = 1 - Math.pow(1 - t, 3);
            
            угол = стартовый + (цель - стартовый) * eased;
            нарисовать();
            
            if (t < 1) {
                requestAnimationFrame(шаг);
            } else {
                // Определяем выигрыш
                // Стрелка сверху. Угол 0 = правая сторона (3 часа). Верх = -PI/2.
                const верх = -Math.PI / 2;
                let нормализованный = (верх - угол) % (Math.PI * 2);
                if (нормализованный < 0) нормализованный += Math.PI * 2;
                
                const сектор = (Math.PI * 2) / призы.length;
                const индекс = Math.floor(нормализованный / сектор) % призы.length;
                const приз = призы[индекс];
                
                результатЭл.textContent = `🎉 ${приз.текст} ${приз.назв}!`;
                результатЭл.className = 'результат выигрыш';
                крутится = false;
                кнопка.disabled = false;
            }
        }
        
        requestAnimationFrame(шаг);
    }
    
    кнопка.onclick = крутить;
    нарисовать();
</script>
</body>
</html>
