<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дудл-прыжок</title>
    <link rel="icon" href="../ico.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        #игра {
            position: relative;
            width: 100%;
            height: 70vh;
            max-height: 600px;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f4ff 100%);
            border-radius: 16px;
            overflow: hidden;
            margin: 12px 0;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        #игрок {
            position: absolute;
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 35% 35%, #90cdf4, #3182ce);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(66, 153, 225, 0.6);
            z-index: 10;
        }
        #игрок.ракета {
            box-shadow: 0 0 25px rgba(237, 137, 54, 0.9);
            background: radial-gradient(circle at 35% 35%, #fbd38d, #dd6b20);
        }
        .платформа {
            position: absolute;
            height: 14px;
            border-radius: 7px;
        }
        .платформа.обычная {
            background: linear-gradient(180deg, #38a169 0%, #22543d 100%);
            box-shadow: 0 3px 0 #1a3a28;
        }
        .платформа.движущаяся {
            background: linear-gradient(180deg, #d69e2e 0%, #744210 100%);
            box-shadow: 0 3px 0 #4a2a08;
        }
        .платформа.ломающаяся {
            background: linear-gradient(180deg, #a0aec0 0%, #4a5568 100%);
            box-shadow: 0 3px 0 #2d3748;
        }
        .платформа.пружинная {
            background: linear-gradient(180deg, #4299e1 0%, #2c5282 100%);
            box-shadow: 0 3px 0 #1a365d;
        }
        .платформа.исчезающая {
            background: linear-gradient(180deg, #9f7aea 0%, #553c9a 100%);
            box-shadow: 0 3px 0 #3c1361;
        }
        .платформа.исчезающая.скрыта {
            opacity: 0.15;
        }
        .платформа.сломанная {
            opacity: 0.2;
        }
        .монета {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, #f6e05e, #d69e2e);
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(246, 224, 94, 0.8);
            z-index: 5;
            animation: вращение-монеты 1s linear infinite;
        }
        @keyframes вращение-монеты {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        #счёт {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 18px;
            z-index: 20;
        }
        #рекорд {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: #f6e05e;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            z-index: 20;
        }
        #монеты-счёт {
            position: absolute;
            top: 50px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            color: #f6e05e;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            z-index: 20;
        }
        .подсказка {
            text-align: center;
            color: #718096;
            font-size: 13px;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="../игры.html" class="back-btn">← Назад</a>
        <span class="badge purple">🎯 Аркада</span>
    </div>
    
    <h1>🦘 Дудл-прыжок</h1>
    
    <div id="игра">
        <div id="счёт">0</div>
        <div id="рекорд">🏆 0</div>
        <div id="монеты-счёт">🪙 0</div>
        <div id="игрок"></div>
    </div>
    
    <div class="подсказка">← → / A D на компе · Тап слева/справа на телефоне</div>
    
    <script>
        const игра = document.getElementById('игра');
        const игрок = document.getElementById('игрок');
        const счётЭл = document.getElementById('счёт');
        const рекордЭл = document.getElementById('рекорд');
        const монетыЭл = document.getElementById('монеты-счёт');
        
        let позицияX = 0;
        let позицияY = 0;
        let скоростьY = 0;
        let платформы = [];
        let монеты = [];
        let счёт = 0;
        let монетыСобрано = 0;
        let рекорд = parseInt(localStorage.getItem('дудл-рекорд') || '0');
        let играИдёт = true;
        let последняяY = 0;
        let анимация;
        let клавиши = {};
        let ракетаТаймер = 0;
        let тачСторона = 0;
        
        const ГРАВИТАЦИЯ = 0.5;
        const СИЛА_ПРЫЖКА = -13;
        const СИЛА_ПРУЖИНЫ = -19;
        const ШИРИНА_ИГРОКА = 44;
        const ВЫСОТА_ИГРОКА = 44;
        const СКОРОСТЬ_Х = 6;
        
        рекордЭл.textContent = '🏆 ' + рекорд;
        
        function старт() {
            играИдёт = true;
            счёт = 0;
            монетыСобрано = 0;
            ракетаТаймер = 0;
            позицияX = игра.offsetWidth / 2 - ШИРИНА_ИГРОКА / 2;
            позицияY = игра.offsetHeight - 200;
            скоростьY = СИЛА_ПРЫЖКА;
            платформы.forEach(p => p.element.remove());
            платформы = [];
            монеты.forEach(m => m.element.remove());
            монеты = [];
            игрок.classList.remove('ракета');
            
            добавитьПлатформу(позицияX - 20, позицияY + ВЫСОТА_ИГРОКА, 'обычная');
            
            последняяY = позицияY + ВЫСОТА_ИГРОКА;
            
            счётЭл.textContent = '0';
            монетыЭл.textContent = '🪙 0';
            
            cancelAnimationFrame(анимация);
            цикл();
        }
        
        function добавитьПлатформу(x, y, тип) {
            const ширина = 70;
            const element = document.createElement('div');
            element.className = 'платформа ' + тип;
            element.style.width = ширина + 'px';
            element.style.left = x + 'px';
            element.style.top = y + 'px';
            игра.appendChild(element);
            
            платформы.push({
                x, y, ширина, тип,
                element,
                сломана: false,
                скрыта: false,
                направление: Math.random() > 0.5 ? 1 : -1,
                таймер: 0
            });
        }
        
        function сгенерироватьСледующую() {
            const верхняя = платформы.length ? Math.min(...платформы.map(p => p.y)) : последняяY;
            const шаг = 100 + Math.random() * 15;
            const новыйY = верхняя - шаг;
            
            const rand = Math.random();
            let тип = 'обычная';
            if (счёт > 200 && rand > 0.85) тип = 'исчезающая';
            else if (счёт > 150 && rand > 0.75) тип = 'пружинная';
            else if (счёт > 100 && rand > 0.6) тип = 'ломающаяся';
            else if (счёт > 50 && rand > 0.4) тип = 'движущаяся';
            
            const ширина = 70;
            let новыйX = 0;
            let попыток = 0;
            
            do {
                новыйX = 10 + Math.random() * (игра.offsetWidth - ширина - 20);
                попыток++;
                const пересекается = платформы.some(p => 
                    Math.abs(p.y - новыйY) < 30 && 
                    новыйX < p.x + p.ширина + 20 && 
                    новыйX + ширина + 20 > p.x
                );
                if (!пересекается) break;
            } while (попыток < 20);
            
            добавитьПлатформу(новыйX, новыйY, тип);
            последняяY = новыйY;
            
            if (Math.random() < 0.3) {
                const монетаX = новыйX + 23;
                const монетаY = новыйY - 40;
                const элемент = document.createElement('div');
                элемент.className = 'монета';
                элемент.style.left = монетаX + 'px';
                элемент.style.top = монетаY + 'px';
                игра.appendChild(элемент);
                монеты.push({ x: монетаX, y: монетаY, element: элемент, собрана: false });
            }
        }
        
        document.addEventListener('keydown', e => { клавиши[e.code] = true; });
        document.addEventListener('keyup', e => { клавиши[e.code] = false; });
        
        игра.addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = игра.getBoundingClientRect();
            тачСторона = (touch.clientX - rect.left) < rect.width / 2 ? -1 : 1;
        }, { passive: false });
        
        игра.addEventListener('touchmove', e => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = игра.getBoundingClientRect();
            тачСторона = (touch.clientX - rect.left) < rect.width / 2 ? -1 : 1;
        }, { passive: false });
        
        игра.addEventListener('touchend', e => {
            e.preventDefault();
            тачСторона = 0;
        }, { passive: false });
        
        игра.addEventListener('touchcancel', e => {
            тачСторона = 0;
        });
        
        function цикл() {
            if (!играИдёт) return;
            
            let dx = 0;
            if (клавиши['ArrowLeft'] || клавиши['KeyA']) dx -= 1;
            if (клавиши['ArrowRight'] || клавиши['KeyD']) dx += 1;
            if (тачСторона !== 0) dx = тачСторона;
            
            позицияX += dx * СКОРОСТЬ_Х;
            
            if (позицияX + ШИРИНА_ИГРОКА < 0) позицияX = игра.offsetWidth;
            if (позицияX > игра.offsetWidth) позицияX = -ШИРИНА_ИГРОКА;
            
            if (ракетаТаймер > 0) {
                ракетаТаймер--;
                скоростьY = -8;
                if (ракетаТаймер === 0) игрок.classList.remove('ракета');
            } else {
                скоростьY += ГРАВИТАЦИЯ;
            }
            позицияY += скоростьY;
            
            const экранY = игра.offsetHeight / 2;
            if (позицияY < экранY) {
                const сдвиг = экранY - позицияY;
                позицияY = экранY;
                платформы.forEach(p => {
                    p.y += сдвиг;
                    p.element.style.top = p.y + 'px';
                });
                монеты.forEach(m => {
                    m.y += сдвиг;
                    m.element.style.top = m.y + 'px';
                });
                последняяY += сдвиг;
                if (ракетаТаймер === 0) {
                    счёт += сдвиг * 0.1;
                    счётЭл.textContent = Math.floor(счёт);
                }
            }
            
            if (позицияY > игра.offsetHeight + 50) {
                умереть();
                return;
            }
            
            if (скоростьY > 0) {
                for (const p of платформы) {
                    if (p.сломана || p.скрыта) continue;
                    const центрИгрока = позицияX + ШИРИНА_ИГРОКА / 2;
                    const ногиИгрока = позицияY + ВЫСОТА_ИГРОКА;
                    if (центрИгрока > p.x && центрИгрока < p.x + p.ширина &&
                        ногиИгрока > p.y && ногиИгрока < p.y + 20) {
                        
                        if (p.тип === 'пружинная') {
                            скоростьY = СИЛА_ПРУЖИНЫ;
                        } else {
                            скоростьY = СИЛА_ПРЫЖКА;
                        }
                        
                        if (p.тип === 'ломающаяся') {
                            p.сломана = true;
                            p.element.classList.add('сломанная');
                            setTimeout(() => {
                                p.element.remove();
                                платформы = платформы.filter(pp => pp !== p);
                            }, 300);
                        }
                        break;
                    }
                }
            }
            
            платформы.forEach(p => {
                if (p.тип === 'движущаяся') {
                    p.x += p.направление * 1.5;
                    if (p.x < 0 || p.x + p.ширина > игра.offsetWidth) p.направление *= -1;
                    p.element.style.left = p.x + 'px';
                }
                if (p.тип === 'исчезающая') {
                    p.таймер++;
                    if (p.таймер % 120 < 30) {
                        p.скрыта = true;
                        p.element.classList.add('скрыта');
                    } else {
                        p.скрыта = false;
                        p.element.classList.remove('скрыта');
                    }
                }
            });
            
            const центрИгрока = позицияX + ШИРИНА_ИГРОКА / 2;
            const центрИгрокаY = позицияY + ВЫСОТА_ИГРОКА / 2;
            монеты.forEach(m => {
                if (m.собрана) return;
                const dx = центрИгрока - (m.x + 12);
                const dy = центрИгрокаY - (m.y + 12);
                if (Math.sqrt(dx * dx + dy * dy) < 30) {
                    m.собрана = true;
                    m.element.remove();
                    монетыСобрано++;
                    счёт += 5;
                    монетыЭл.textContent = '🪙 ' + монетыСобрано;
                    счётЭл.textContent = Math.floor(счёт);
                    if (монетыСобрано % 5 === 0) {
                        ракетаТаймер = 120;
                        игрок.classList.add('ракета');
                    }
                }
            });
            
            let верхняяY = платформы.length ? Math.min(...платформы.map(p => p.y)) : 0;
            let защита = 0;
            while (верхняяY > -200 && защита < 50) {
                сгенерироватьСледующую();
                верхняяY = Math.min(...платформы.map(p => p.y));
                защита++;
            }
            
            платформы = платформы.filter(p => {
                if (p.y > игра.offsetHeight + 50) { p.element.remove(); return false; }
                return true;
            });
            монеты = монеты.filter(m => {
                if (m.собрана || m.y > игра.offsetHeight + 50) { m.element.remove(); return false; }
                return true;
            });
            
            игрок.style.left = позицияX + 'px';
            игрок.style.top = позицияY + 'px';
            
            анимация = requestAnimationFrame(цикл);
        }
        
        function умереть() {
            играИдёт = false;
            const итог = Math.floor(счёт);
            if (итог > рекорд) {
                рекорд = итог;
                localStorage.setItem('дудл-рекорд', рекорд);
                рекордЭл.textContent = '🏆 ' + рекорд;
            }
            
            setTimeout(() => {
                if (confirm('💀 Игра окончена!\nСчёт: ' + итог + '\nМонет: ' + монетыСобрано + '\n\nИграть заново?')) {
                    старт();
                }
            }, 100);
        }
        
        setTimeout(старт, 100);
    </script>
</body>
</html>
