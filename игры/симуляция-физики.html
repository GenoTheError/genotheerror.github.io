<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Энергия Солнца и Ветра | Гигантские элементы</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a2a1c, #05140c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 15px;
        }
        
        .game-container {
            background: #1a3a24;
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 30px 45px rgba(0,0,0,0.6);
        }
        
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            cursor: grab;
            touch-action: none;
            width: 100%;
            height: auto;
            background: #f5f5e0;
        }
        
        canvas:active {
            cursor: grabbing;
        }
        
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            background: #0e2517;
            padding: 14px 20px;
            border-radius: 100px;
        }
        
        .tool-btn {
            background: #2e5a3c;
            border: none;
            padding: 12px 22px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        
        .tool-btn:active {
            transform: scale(0.96);
        }
        
        .tool-btn.selected {
            background: #f5b042;
            color: #1a2a1a;
            box-shadow: 0 0 0 3px #fff0b5;
        }
        
        .info-panel {
            margin-top: 20px;
            background: #0d2013dd;
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: #fafae8;
            font-weight: 700;
        }
        
        .voltage-box {
            background: #030c06;
            padding: 10px 28px;
            border-radius: 60px;
            font-family: monospace;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ffea80;
            text-shadow: 0 0 6px #ffb347;
        }
        
        .status {
            font-size: 1rem;
            background: #1f4429;
            padding: 8px 22px;
            border-radius: 48px;
        }
        
        @media (max-width: 750px) {
            .tool-btn { padding: 8px 14px; font-size: 0.8rem; }
            .voltage-box { font-size: 1.5rem; padding: 6px 18px; }
            .status { font-size: 0.8rem; }
            .info-panel { padding: 12px 16px; }
        }
        
        .instruction {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 14px;
            color: #c8f0bc;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="toolbar">
            <button class="tool-btn" data-type="light">☀️ Свет</button>
            <button class="tool-btn" data-type="wind_source">🌬️ Ветер</button>
            <button class="tool-btn" data-type="panel">🔆 Солн. панель</button>
            <button class="tool-btn" data-type="wind_turbine">🌀 Ветряк</button>
            <button class="tool-btn" data-type="wire_h">➡️ Провод (гор.)</button>
            <button class="tool-btn" data-type="wire_v">⬇️ Провод (верт.)</button>
            <button class="tool-btn" data-type="bulb">💡 Лампочка</button>
            <button class="tool-btn" data-type="display">📟 Табло</button>
            <button class="tool-btn" data-type="remove">🗑 Удалить</button>
        </div>
        <canvas id="gameCanvas" width="1400" height="850" style="width:100%; height:auto; max-width:1400px; aspect-ratio:1400/850"></canvas>
        <div class="info-panel">
            <div class="status">⚙️ Режим: <span id="modeLabel">Выберите предмет</span></div>
            <div class="voltage-box">⚡ Напряжение: <span id="voltageDisplay">0.0</span> В</div>
            <div class="status">🌬️ Ветер + ☀️ Свет | Лучи и препятствия</div>
        </div>
        <div class="instruction">
            📱 Перетаскивайте пальцем | 🔌 Провода соединяют панели/ветряк с табло и лампочками | 💡 Лампочка светится от напряжения
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let objects = [];   
        let selectedTool = 'light';
        let draggedObj = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let isDragging = false;
        
        const voltageSpan = document.getElementById('voltageDisplay');
        const modeLabelSpan = document.getElementById('modeLabel');
        
        // 🔥 ОГРОМНЫЕ РАЗМЕРЫ (увеличены ещё сильнее)
        const LIGHT_SIZE = 110;           // источник света огромный
        const WIND_SOURCE_SIZE = 110;     // источник ветра
        const PANEL_W = 270, PANEL_H = 170;
        const TURBINE_W = 210, TURBINE_H = 210;
        const WIRE_H_W = 220, WIRE_H_H = 50;    // горизонтальный провод толстый
        const WIRE_V_W = 50, WIRE_V_H = 220;    // вертикальный провод
        const BULB_W = 120, BULB_H = 120;
        const DISPLAY_W = 230, DISPLAY_H = 140;
        
        // Начальная сцена с гигантскими объектами
        function initScene(){
            objects = [];
            // Солнечный источник
            objects.push({ type: 'light', x: 60, y: 60, w: LIGHT_SIZE, h: LIGHT_SIZE });
            // Источник ветра
            objects.push({ type: 'wind_source', x: 1180, y: 100, w: WIND_SOURCE_SIZE, h: WIND_SOURCE_SIZE });
            // Солнечная панель
            objects.push({ type: 'panel', x: 520, y: 320, w: PANEL_W, h: PANEL_H });
            // Ветрогенератор
            objects.push({ type: 'wind_turbine', x: 960, y: 520, w: TURBINE_W, h: TURBINE_H });
            // Табло
            objects.push({ type: 'display', x: 1100, y: 680, w: DISPLAY_W, h: DISPLAY_H });
            // Лампочка
            objects.push({ type: 'bulb', x: 200, y: 680, w: BULB_W, h: BULB_H });
            // Горизонтальные провода
            objects.push({ type: 'wire_h', x: 790, y: 370, w: WIRE_H_W, h: WIRE_H_H });
            objects.push({ type: 'wire_h', x: 360, y: 720, w: WIRE_H_W, h: WIRE_H_H });
            // Вертикальный провод
            objects.push({ type: 'wire_v', x: 1080, y: 630, w: WIRE_V_W, h: WIRE_V_H });
        }
        
        // Геометрия
        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }
        
        function segmentIntersectRect(x1,y1, x2,y2, rect){
            if (Math.max(x1,x2) < rect.x) return false;
            if (Math.min(x1,x2) > rect.x+rect.w) return false;
            if (Math.max(y1,y2) < rect.y) return false;
            if (Math.min(y1,y2) > rect.y+rect.h) return false;
            function segIntersectLine(ax,ay, bx,by, cx,cy, dx,dy){
                const denom = (bx-ax)*(dy-cy) - (by-ay)*(dx-cx);
                if (denom === 0) return null;
                const t = ((cx-ax)*(dy-cy) - (cy-ay)*(dx-cx)) / denom;
                const u = ((cx-ax)*(by-ay) - (cy-ay)*(bx-ax)) / denom;
                if (t>=0 && t<=1 && u>=0 && u<=1) return { x: ax + t*(bx-ax), y: ay + t*(by-ay) };
                return null;
            }
            const edges = [
                [rect.x, rect.y, rect.x+rect.w, rect.y],
                [rect.x+rect.w, rect.y, rect.x+rect.w, rect.y+rect.h],
                [rect.x+rect.w, rect.y+rect.h, rect.x, rect.y+rect.h],
                [rect.x, rect.y+rect.h, rect.x, rect.y]
            ];
            for(let e of edges){
                if(segIntersectLine(x1,y1,x2,y2, e[0],e[1], e[2],e[3])) return true;
            }
            return false;
        }
        
        function getFirstIntersection(x1,y1, x2,y2, ignoreObj) {
            let closestDist = Infinity;
            let hitObj = null;
            for(let obj of objects){
                if(obj === ignoreObj) continue;
                const rect = { x: obj.x, y: obj.y, w: obj.w, h: obj.h };
                if(segmentIntersectRect(x1,y1, x2,y2, rect)){
                    const centerX = obj.x+obj.w/2, centerY = obj.y+obj.h/2;
                    const dx = centerX - x1, dy = centerY - y1;
                    const dist = dx*dx+dy*dy;
                    if(dist < closestDist){
                        closestDist = dist;
                        hitObj = obj;
                    }
                }
            }
            return hitObj;
        }
        
        // Солнечная энергия
        function calculateSolarPower(panel){
            let totalPower = 0;
            const lights = objects.filter(o => o.type === 'light');
            const centerX = panel.x + panel.w/2;
            const centerY = panel.y + panel.h/2;
            for(let light of lights){
                const lx = light.x + light.w/2;
                const ly = light.y + light.h/2;
                const rayCount = 28;
                for(let i=0; i<rayCount; i++){
                    const angle = (i / rayCount) * Math.PI * 2;
                    const dx = Math.cos(angle);
                    const dy = Math.sin(angle);
                    const endX = lx + dx * 850;
                    const endY = ly + dy * 850;
                    let hitObj = getFirstIntersection(lx, ly, endX, endY, light);
                    if(hitObj === panel){
                        let dirX = (centerX - lx);
                        let dirY = (centerY - ly);
                        let len = Math.hypot(dirX, dirY);
                        if(len>0.01){ dirX/=len; dirY/=len; }
                        let normalX = 0, normalY = 1;
                        let dot = dirX*normalX + dirY*normalY;
                        let intensity = Math.max(0, dot);
                        totalPower += 1.3 * intensity;
                    }
                }
            }
            return Math.min(38, totalPower);
        }
        
        // Энергия ветра (яркие насыщенные лучи)
        function calculateWindTurbinePower(turbine){
            let totalWind = 0;
            const windSources = objects.filter(o => o.type === 'wind_source');
            const turbineCenterX = turbine.x + turbine.w/2;
            const turbineCenterY = turbine.y + turbine.h/2;
            for(let wSource of windSources){
                const sx = wSource.x + wSource.w/2;
                const sy = wSource.y + wSource.h/2;
                const rayCount = 28;
                for(let i=0; i<rayCount; i++){
                    const angle = (i / rayCount) * Math.PI * 2;
                    const dx = Math.cos(angle);
                    const dy = Math.sin(angle);
                    const endX = sx + dx * 800;
                    const endY = sy + dy * 800;
                    let hitObj = getFirstIntersection(sx, sy, endX, endY, wSource);
                    if(hitObj === turbine){
                        let dirX = (turbineCenterX - sx);
                        let dirY = (turbineCenterY - sy);
                        let len = Math.hypot(dirX, dirY);
                        if(len>0.01){ dirX/=len; dirY/=len; }
                        let horizontalEff = Math.abs(dirX) * 0.8 + Math.abs(dirY) * 0.2;
                        totalWind += 1.4 * horizontalEff;
                    }
                }
            }
            return Math.min(36, totalWind);
        }
        
        // Проверка соединения через провода
        function isConnectedViaWires(source, target){
            const wires = objects.filter(o => o.type === 'wire_h' || o.type === 'wire_v');
            if(wires.length === 0) return false;
            const sourceRect = { x: source.x, y: source.y, w: source.w, h: source.h };
            const targetRect = { x: target.x, y: target.y, w: target.w, h: target.h };
            let touchingSource = false, touchingTarget = false;
            for(let wire of wires){
                const wireRect = { x: wire.x, y: wire.y, w: wire.w, h: wire.h };
                if(rectIntersect(wireRect, sourceRect)) touchingSource = true;
                if(rectIntersect(wireRect, targetRect)) touchingTarget = true;
            }
            if(touchingSource && touchingTarget){
                let wireGroup = [];
                for(let w of wires){
                    if(rectIntersect({x:w.x,y:w.y,w:w.w,h:w.h}, sourceRect) || 
                       rectIntersect({x:w.x,y:w.y,w:w.w,h:w.h}, targetRect)) wireGroup.push(w);
                }
                if(wireGroup.length === 0) return false;
                for(let w of wireGroup){
                    if(rectIntersect({x:w.x,y:w.y,w:w.w,h:w.h}, sourceRect) && 
                       rectIntersect({x:w.x,y:w.y,w:w.w,h:w.h}, targetRect)) return true;
                }
                for(let i=0;i<wireGroup.length;i++){
                    for(let j=i+1;j<wireGroup.length;j++){
                        if(rectIntersect({x:wireGroup[i].x,y:wireGroup[i].y,w:wireGroup[i].w,h:wireGroup[i].h}, 
                                         {x:wireGroup[j].x,y:wireGroup[j].y,w:wireGroup[j].w,h:wireGroup[j].h}))
                            return true;
                    }
                }
                return wireGroup.length > 1;
            }
            return false;
        }
        
        // Главная логика напряжения
        function getSystemVoltageAndUpdate(){
            let sources = [];
            const panels = objects.filter(o => o.type === 'panel');
            const turbines = objects.filter(o => o.type === 'wind_turbine');
            const displays = objects.filter(o => o.type === 'display');
            const bulbs = objects.filter(o => o.type === 'bulb');
            
            for(let p of panels){
                let solarVolts = calculateSolarPower(p);
                if(solarVolts > 0.5) sources.push({obj: p, voltage: solarVolts});
            }
            for(let t of turbines){
                let windVolts = calculateWindTurbinePower(t);
                if(windVolts > 0.5) sources.push({obj: t, voltage: windVolts});
            }
            
            let displayVoltageMap = new Map();
            for(let disp of displays){
                let totalV = 0;
                for(let src of sources){
                    if(isConnectedViaWires(src.obj, disp)) totalV += src.voltage;
                }
                totalV = Math.min(90, totalV);
                displayVoltageMap.set(disp, totalV);
            }
            
            for(let bulb of bulbs){
                let bulbVoltage = 0;
                for(let src of sources){
                    if(isConnectedViaWires(src.obj, bulb)) bulbVoltage += src.voltage;
                }
                bulbVoltage = Math.min(80, bulbVoltage);
                bulb.voltage = bulbVoltage;
            }
            
            if(displays.length > 0) return displayVoltageMap.get(displays[0]) || 0;
            if(bulbs.length > 0) return bulbs.reduce((sum,b)=>sum + (b.voltage||0),0)/bulbs.length;
            return 0;
        }
        
        function updateUI(){
            let voltage = getSystemVoltageAndUpdate();
            voltageSpan.innerText = voltage.toFixed(1);
        }
        
        // Отрисовка лучей СВЕТА (желтые насыщенные)
        function drawLightRays(){
            const lights = objects.filter(o => o.type === 'light');
            for(let light of lights){
                const cx = light.x + light.w/2;
                const cy = light.y + light.h/2;
                const rayCount = 40;
                for(let i=0;i<rayCount;i++){
                    const angle = (i / rayCount) * Math.PI * 2;
                    const dx = Math.cos(angle);
                    const dy = Math.sin(angle);
                    const endX = cx + dx * 400;
                    const endY = cy + dy * 400;
                    let hit = getFirstIntersection(cx,cy,endX,endY, light);
                    let drawTo = { x: endX, y: endY };
                    if(hit) drawTo = { x: hit.x + hit.w/2, y: hit.y + hit.h/2 };
                    ctx.beginPath();
                    ctx.moveTo(cx,cy);
                    ctx.lineTo(drawTo.x, drawTo.y);
                    ctx.strokeStyle = "#FFD700";
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 8;
                    ctx.stroke();
                    let arrowAngle = Math.atan2(drawTo.y-cy, drawTo.x-cx);
                    let arrowX = drawTo.x - 15*Math.cos(arrowAngle);
                    let arrowY = drawTo.y - 15*Math.sin(arrowAngle);
                    ctx.beginPath();
                    ctx.moveTo(arrowX, arrowY);
                    ctx.lineTo(arrowX - 9*Math.cos(arrowAngle - 0.5), arrowY - 9*Math.sin(arrowAngle - 0.5));
                    ctx.lineTo(arrowX - 9*Math.cos(arrowAngle + 0.5), arrowY - 9*Math.sin(arrowAngle + 0.5));
                    ctx.fillStyle = "#FFAA33";
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;
        }
        
        // Отрисовка лучей ВЕТРА (яркие насыщенные голубые/бирюзовые с пульсацией)
        function drawWindRays(){
            const windSources = objects.filter(o => o.type === 'wind_source');
            const time = Date.now() / 300;
            for(let wsrc of windSources){
                const cx = wsrc.x + wsrc.w/2;
                const cy = wsrc.y + wsrc.h/2;
                const rayCount = 38;
                for(let i=0;i<rayCount;i++){
                    const angle = (i / rayCount) * Math.PI * 2;
                    const dx = Math.cos(angle);
                    const dy = Math.sin(angle);
                    const endX = cx + dx * 380;
                    const endY = cy + dy * 380;
                    let hit = getFirstIntersection(cx,cy,endX,endY, wsrc);
                    let drawTo = { x: endX, y: endY };
                    if(hit) drawTo = { x: hit.x + hit.w/2, y: hit.y + hit.h/2 };
                    ctx.beginPath();
                    ctx.moveTo(cx,cy);
                    ctx.lineTo(drawTo.x, drawTo.y);
                    // Насыщенный бирюзово-голубой
                    const intensity = 0.6 + Math.sin(time + i) * 0.3;
                    ctx.strokeStyle = `rgba(0, 210, 255, ${0.7 + intensity * 0.3})`;
                    ctx.lineWidth = 5;
                    ctx.setLineDash([10, 12]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    let arrowAngle = Math.atan2(drawTo.y-cy, drawTo.x-cx);
                    let arrowX = drawTo.x - 16*Math.cos(arrowAngle);
                    let arrowY = drawTo.y - 16*Math.sin(arrowAngle);
                    ctx.beginPath();
                    ctx.moveTo(arrowX, arrowY);
                    ctx.lineTo(arrowX - 10*Math.cos(arrowAngle - 0.6), arrowY - 10*Math.sin(arrowAngle - 0.6));
                    ctx.lineTo(arrowX - 10*Math.cos(arrowAngle + 0.6), arrowY - 10*Math.sin(arrowAngle + 0.6));
                    ctx.fillStyle = "#00D0FF";
                    ctx.fill();
                }
            }
        }
        
        function draw(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#FFF8E7";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            // сетка
            ctx.strokeStyle = "#DDEEBB";
            ctx.lineWidth = 1;
            for(let i=0;i<canvas.width;i+=70){
                ctx.beginPath();
                ctx.moveTo(i,0);
                ctx.lineTo(i,canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0,i%canvas.height);
                ctx.lineTo(canvas.width,i%canvas.height);
                ctx.stroke();
            }
            
            drawLightRays();
            drawWindRays();
            
            for(let obj of objects){
                if(obj.type === 'light'){
                    ctx.shadowBlur = 28;
                    ctx.fillStyle = "#FFE066";
                    ctx.beginPath();
                    ctx.arc(obj.x+obj.w/2, obj.y+obj.h/2, obj.w/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#FFAA22";
                    ctx.beginPath();
                    ctx.arc(obj.x+obj.w/2, obj.y+obj.h/2, obj.w/2.8, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = "bold 56px sans-serif";
                    ctx.fillStyle = "#FFFFFF";
                    ctx.shadowBlur = 6;
                    ctx.fillText("☀️", obj.x+28, obj.y+78);
                    ctx.shadowBlur = 0;
                }
                else if(obj.type === 'wind_source'){
                    ctx.fillStyle = "#33CCFF";
                    ctx.shadowBlur = 24;
                    ctx.beginPath();
                    ctx.arc(obj.x+obj.w/2, obj.y+obj.h/2, obj.w/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#0099EE";
                    ctx.beginPath();
                    ctx.arc(obj.x+obj.w/2, obj.y+obj.h/2, obj.w/2.8, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.font = "bold 58px sans-serif";
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillText("🌬️", obj.x+28, obj.y+80);
                }
                else if(obj.type === 'panel'){
                    ctx.fillStyle = "#2A7FB0";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = "#D4F0FF";
                    for(let i=1; i<=5; i++){
                        ctx.fillRect(obj.x+20, obj.y + i*(obj.h/6)-10, obj.w-40, 14);
                    }
                    ctx.strokeStyle = "#0E4A6E";
                    ctx.lineWidth = 5;
                    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.font = "bold 44px sans-serif";
                    ctx.fillStyle = "#FFF9CF";
                    ctx.fillText("🔆", obj.x+obj.w-65, obj.y+65);
                }
                else if(obj.type === 'wind_turbine'){
                    ctx.fillStyle = "#4A8FB5";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = "#CCF0FF";
                    let time = Date.now() / 320;
                    for(let i=0;i<3;i++){
                        let angle = time + i*2.2;
                        let offX = Math.sin(angle)*16;
                        ctx.fillRect(obj.x+28+i*52, obj.y+55+offX, 28, 75);
                    }
                    ctx.fillStyle = "#1A5578";
                    ctx.font = "bold 64px sans-serif";
                    ctx.fillText("🌀", obj.x+obj.w-75, obj.y+obj.h-40);
                    let power = calculateWindTurbinePower(obj);
                    ctx.font = "bold 24px monospace";
                    ctx.fillStyle = "#FFFFC0";
                    ctx.fillText(power.toFixed(1)+"V", obj.x+18, obj.y+48);
                }
                else if(obj.type === 'wire_h'){
                    ctx.fillStyle = "#5A5A7A";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = "#C0C0E8";
                    for(let i=0;i<4;i++) ctx.fillRect(obj.x+24 + i*48, obj.y+12, 14, obj.h-24);
                }
                else if(obj.type === 'wire_v'){
                    ctx.fillStyle = "#5A5A7A";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = "#C0C0E8";
                    for(let i=0;i<4;i++) ctx.fillRect(obj.x+14, obj.y+24 + i*52, obj.w-28, 14);
                }
                else if(obj.type === 'display'){
                    ctx.fillStyle = "#0A1022";
                    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
                    ctx.fillStyle = "#44FFAA";
                    ctx.font = "bold 44px monospace";
                    ctx.fillText("⚡", obj.x+obj.w-70, obj.y+obj.h-40);
                    let dispVoltage = 0;
                    const gens = objects.filter(o=>o.type==='panel'||o.type==='wind_turbine');
                    for(let gen of gens){
                        if(isConnectedViaWires(gen, obj)){
                            if(gen.type==='panel') dispVoltage += calculateSolarPower(gen);
                            if(gen.type==='wind_turbine') dispVoltage += calculateWindTurbinePower(gen);
                        }
                    }
                    dispVoltage = Math.min(90, dispVoltage);
                    ctx.fillStyle = "#FFEEAA";
                    ctx.font = "bold 52px 'Courier New'";
                    ctx.fillText(dispVoltage.toFixed(0)+"V", obj.x+30, obj.y+obj.h-35);
                }
                else if(obj.type === 'bulb'){
                    let brightness = obj.voltage || 0;
                    let glow = Math.min(1, brightness / 28);
                    let r = 230 + Math.floor(25 * glow);
                    let g = 200 + Math.floor(55 * glow);
                    let b = 40;
                    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    ctx.shadowBlur = 36 * glow;
                    ctx.beginPath();
                    ctx.ellipse(obj.x+obj.w/2, obj.y+obj.h/2, obj.w/2.2, obj.h/2, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#FFEEBB";
                    ctx.font = "64px sans-serif";
                    ctx.fillText("💡", obj.x+28, obj.y+obj.h-28);
                    if(brightness>1){
                        ctx.font = "bold 22px monospace";
                        ctx.fillStyle = "#FFFFAA";
                        ctx.fillText(brightness.toFixed(0)+"W", obj.x+26, obj.y+48);
                    }
                    ctx.shadowBlur = 0;
                }
            }
        }
        
        // Взаимодействия
        function getMouseCoord(e){
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            if(e.touches){
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(canvas.width-30, Math.max(30, canvasX));
            canvasY = Math.min(canvas.height-30, Math.max(30, canvasY));
            return { x: canvasX, y: canvasY };
        }
        
        function findObjectAt(x,y){
            for(let i=objects.length-1; i>=0; i--){
                let obj = objects[i];
                if(x >= obj.x && x <= obj.x+obj.w && y >= obj.y && y <= obj.y+obj.h) return obj;
            }
            return null;
        }
        
        function onPointerDown(e){
            e.preventDefault();
            const coord = getMouseCoord(e);
            const obj = findObjectAt(coord.x, coord.y);
            if(obj){
                draggedObj = obj;
                dragOffsetX = coord.x - obj.x;
                dragOffsetY = coord.y - obj.y;
                isDragging = true;
                return;
            }
            if(selectedTool !== 'remove'){
                let newObj = null;
                let wd=0, ht=0;
                if(selectedTool === 'light'){ wd=LIGHT_SIZE; ht=LIGHT_SIZE; }
                else if(selectedTool === 'wind_source'){ wd=WIND_SOURCE_SIZE; ht=WIND_SOURCE_SIZE; }
                else if(selectedTool === 'panel'){ wd=PANEL_W; ht=PANEL_H; }
                else if(selectedTool === 'wind_turbine'){ wd=TURBINE_W; ht=TURBINE_H; }
                else if(selectedTool === 'wire_h'){ wd=WIRE_H_W; ht=WIRE_H_H; }
                else if(selectedTool === 'wire_v'){ wd=WIRE_V_W; ht=WIRE_V_H; }
                else if(selectedTool === 'bulb'){ wd=BULB_W; ht=BULB_H; }
                else if(selectedTool === 'display'){ wd=DISPLAY_W; ht=DISPLAY_H; }
                let x = coord.x - wd/2;
                let y = coord.y - ht/2;
                x = Math.min(canvas.width - wd, Math.max(0, x));
                y = Math.min(canvas.height - ht, Math.max(0, y));
                if(selectedTool === 'light') newObj = { type:'light', x, y, w:wd, h:ht };
                if(selectedTool === 'wind_source') newObj = { type:'wind_source', x, y, w:wd, h:ht };
                if(selectedTool === 'panel') newObj = { type:'panel', x, y, w:wd, h:ht };
                if(selectedTool === 'wind_turbine') newObj = { type:'wind_turbine', x, y, w:wd, h:ht };
                if(selectedTool === 'wire_h') newObj = { type:'wire_h', x, y, w:wd, h:ht };
                if(selectedTool === 'wire_v') newObj = { type:'wire_v', x, y, w:wd, h:ht };
                if(selectedTool === 'bulb') newObj = { type:'bulb', x, y, w:wd, h:ht, voltage:0 };
                if(selectedTool === 'display') newObj = { type:'display', x, y, w:wd, h:ht };
                if(newObj) objects.push(newObj);
            } else {
                if(obj) objects = objects.filter(o => o !== obj);
            }
            updateUI();
        }
        
        function onPointerMove(e){
            if(!isDragging || !draggedObj) return;
            e.preventDefault();
            const coord = getMouseCoord(e);
            let newX = coord.x - dragOffsetX;
            let newY = coord.y - dragOffsetY;
            newX = Math.min(canvas.width - draggedObj.w, Math.max(0, newX));
            newY = Math.min(canvas.height - draggedObj.h, Math.max(0, newY));
            draggedObj.x = newX;
            draggedObj.y = newY;
            updateUI();
        }
        
        function onPointerUp(e){
            isDragging = false;
            draggedObj = null;
            updateUI();
        }
        
        function animationLoop(){
            draw();
            updateUI();
            requestAnimationFrame(animationLoop);
        }
        
        function bindToolButtons(){
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const type = btn.dataset.type;
                    if(type === 'light') selectedTool = 'light';
                    else if(type === 'wind_source') selectedTool = 'wind_source';
                    else if(type === 'panel') selectedTool = 'panel';
                    else if(type === 'wind_turbine') selectedTool = 'wind_turbine';
                    else if(type === 'wire_h') selectedTool = 'wire_h';
                    else if(type === 'wire_v') selectedTool = 'wire_v';
                    else if(type === 'bulb') selectedTool = 'bulb';
                    else if(type === 'display') selectedTool = 'display';
                    else if(type === 'remove') selectedTool = 'remove';
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    const names = { light:'☀️ Свет', wind_source:'🌬️ Ветер (источник)', panel:'🔆 Солнечная панель', wind_turbine:'🌀 Ветряк', wire_h:'➡️ Провод гор.', wire_v:'⬇️ Провод верт.', bulb:'💡 Лампочка', display:'📟 Табло', remove:'🗑 Удаление' };
                    modeLabelSpan.innerText = names[selectedTool] || 'Выберите предмет';
                });
            });
            document.querySelector('[data-type="light"]').classList.add('selected');
            modeLabelSpan.innerText = '☀️ Свет';
        }
        
        initScene();
        bindToolButtons();
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        canvas.addEventListener('touchend', onPointerUp);
        animationLoop();
    })();
</script>
</body>
</html>
