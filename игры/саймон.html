<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Саймон</title>
    <link rel="icon" href="../ico.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        .поле {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px auto;
            aspect-ratio: 1;
            max-width: 400px;
            width: 100%;
        }
        .квадрат {
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0.6;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        .квадрат:hover {
            opacity: 0.8;
        }
        .квадрат.активен {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 0 30px currentColor;
        }
        .квадрат.красный { background: #e53e3e; color: #e53e3e; }
        .квадрат.синий { background: #3182ce; color: #3182ce; }
        .квадрат.зелёный { background: #38a169; color: #38a169; }
        .квадрат.жёлтый { background: #d69e2e; color: #d69e2e; }
        
        .инфо {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 16px 0;
        }
        .инфо-блок {
            background: #2d3748;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
        }
        .инфо-блок .label {
            color: #a0aec0;
            font-size: 13px;
        }
        .инфо-блок .value {
            color: #e2e8f0;
            font-weight: 700;
            font-size: 22px;
        }
        .кнопка {
            background: #4299e1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: block;
            margin: 10px auto;
            touch-action: manipulation;
        }
        .кнопка:hover {
            background: #3182ce;
        }
        .статус {
            text-align: center;
            font-size: 16px;
            color: #a0aec0;
            min-height: 24px;
            margin: 8px 0;
        }
        
        /* Кнопка вкл/выкл звука */
        .звук-кнопка {
            position: fixed;
            top: 16px;
            right: 70px;
            background: #2d3748;
            color: #90cdf4;
            border: 1px solid #4299e1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-family: inherit;
        }
        .звук-кнопка:hover {
            background: #4299e1;
            color: white;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="../игры.html" class="back-btn">← Назад</a>
        <span class="badge purple">🎵 Память</span>
    </div>
    
    <!-- Кнопка вкл/выкл звука -->
    <button class="звук-кнопка" id="звукКнопка" title="Звук">🔊</button>
    
    <h1>🎵 Саймон</h1>
    
    <div class="инфо">
        <div class="инфо-блок">
            <div class="label">Раунд</div>
            <div class="value" id="раунд">0</div>
        </div>
        <div class="инфо-блок">
            <div class="label">Рекорд</div>
            <div class="value" id="рекорд">0</div>
        </div>
    </div>
    
    <div class="статус" id="статус">Нажми «Начать»</div>
    
    <div class="поле" id="поле">
        <div class="квадрат красный" data-цвет="0"></div>
        <div class="квадрат синий" data-цвет="1"></div>
        <div class="квадрат зелёный" data-цвет="2"></div>
        <div class="квадрат жёлтый" data-цвет="3"></div>
    </div>
    
    <button class="кнопка" id="кнопкаНачать">▶️ Начать</button>
    
    <script>
        // ==========================================
        // ЗВУК (Web Audio API)
        // ==========================================
        let аудио = null;
        let звукВкл = true;
        
        // Частоты для каждого квадрата
        const НОТЫ = [
            261.63, // 🔴 Красный — До первой октавы
            329.63, // 🔵 Синий — Ми
            392.00, // 🟢 Зелёный — Соль
            523.25  // 🟡 Жёлтый — До второй октавы
        ];
        
        function получитьАудио() {
            if (!аудио) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    аудио = new AudioContext();
                }
            }
            return аудио;
        }
        
        function игратьНоту(цвет) {
    if (!звукВкл) return;
    
    const ctx = получитьАудио();
    if (!ctx) return;
    
    if (ctx.state === 'suspended') {
        ctx.resume();
    }
    
    const частота = НОТЫ[цвет];
    const сейчас = ctx.currentTime;
    const длительность = 0.8;
    
    // Тон 1 — основной
    const осц1 = ctx.createOscillator();
    const усил1 = ctx.createGain();
    осц1.type = 'sine';
    осц1.frequency.value = частота;
    усил1.gain.setValueAtTime(1.0, сейчас);
    усил1.gain.exponentialRampToValueAtTime(0.001, сейчас + длительность);
    осц1.connect(усил1);
    усил1.connect(ctx.destination);
    осц1.start(сейчас);
    осц1.stop(сейчас + длительность);
    
    // Тон 2 — октавой выше
    const осц2 = ctx.createOscillator();
    const усил2 = ctx.createGain();
    осц2.type = 'sine';
    осц2.frequency.value = частота * 2;
    усил2.gain.setValueAtTime(0.7, сейчас);
    усил2.gain.exponentialRampToValueAtTime(0.001, сейчас + длительность);
    осц2.connect(усил2);
    усил2.connect(ctx.destination);
    осц2.start(сейчас);
    осц2.stop(сейчас + длительность);
    
    // Тон 3 — на октаву ниже (для "тела")
    const осц3 = ctx.createOscillator();
    const усил3 = ctx.createGain();
    осц3.type = 'triangle';
    осц3.frequency.value = частота / 2;
    усил3.gain.setValueAtTime(0.8, сейчас);
    усил3.gain.exponentialRampToValueAtTime(0.001, сейчас + длительность);
    осц3.connect(усил3);
    усил3.connect(ctx.destination);
    осц3.start(сейчас);
    осц3.stop(сейчас + длительность);
}
        
        // Кнопка вкл/выкл звука
        const звукКнопка = document.getElementById('звукКнопка');
        звукКнопка.addEventListener('click', function() {
            звукВкл = !звукВкл;
            звукКнопка.textContent = звукВкл ? '🔊' : '🔇';
        });
        
        // ==========================================
        // ИГРА
        // ==========================================
        const квадраты = document.querySelectorAll('.квадрат');
        const статус = document.getElementById('статус');
        const раундЭл = document.getElementById('раунд');
        const рекордЭл = document.getElementById('рекорд');
        
        let последовательность = [];
        let ходИгрока = 0;
        let раунд = 0;
        let рекорд = parseInt(localStorage.getItem('саймон-рекорд') || '0');
        let идётПоказ = false;
        let играИдёт = false;
        
        рекордЭл.textContent = рекорд;
        
        квадраты.forEach(function(к) {
            к.addEventListener('click', function() {
                клик(parseInt(к.dataset.цвет));
            });
        });
        
        document.getElementById('кнопкаНачать').addEventListener('click', начать);
        
        function начать() {
            // Первый клик — разблокировка звука в браузере
            const ctx = получитьАудио();
            if (ctx && ctx.state === 'suspended') {
                ctx.resume();
            }
            
            последовательность = [];
            раунд = 0;
            ходИгрока = 0;
            играИдёт = true;
            раундЭл.textContent = '0';
            следующийРаунд();
        }
        
        function следующийРаунд() {
            раунд++;
            раундЭл.textContent = раунд;
            ходИгрока = 0;
            последовательность.push(Math.floor(Math.random() * 4));
            показать();
        }
        
        function показать() {
            идётПоказ = true;
            статус.textContent = 'Смотри внимательно...';
            
            let i = 0;
            const интервал = setInterval(function() {
                if (i >= последовательность.length) {
                    clearInterval(интервал);
                    идётПоказ = false;
                    статус.textContent = 'Твой ход!';
                    return;
                }
                подсветить(последовательность[i]);
                i++;
            }, 700);
        }
        
        function подсветить(цвет) {
            const к = квадраты[цвет];
            к.classList.add('активен');
            игратьНоту(цвет); // звук
            setTimeout(function() {
                к.classList.remove('активен');
            }, 400);
        }
        
        function клик(цвет) {
            if (!играИдёт) return;
            if (идётПоказ) return;
            if (последовательность.length === 0) return;
            
            подсветить(цвет);
            
            if (цвет === последовательность[ходИгрока]) {
                ходИгрока++;
                if (ходИгрока === последовательность.length) {
                    статус.textContent = '✅ Верно!';
                    идётПоказ = true;
                    setTimeout(function() {
                        идётПоказ = false;
                        следующийРаунд();
                    }, 800);
                }
            } else {
                // Проигрыш — звук ошибки (низкий тон)
                игратьОшибку();
                играИдёт = false;
                статус.textContent = '❌ Ошибка! Раунд: ' + раунд;
                if (раунд - 1 > рекорд) {
                    рекорд = раунд - 1;
                    localStorage.setItem('саймон-рекорд', рекорд);
                    рекордЭл.textContent = рекорд;
                }
                последовательность = [];
            }
        }
        
        function игратьОшибку() {
    if (!звукВкл) return;
    const ctx = получитьАудио();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    
    const сейчас = ctx.currentTime;
    
    const осц1 = ctx.createOscillator();
    const усил1 = ctx.createGain();
    осц1.type = 'sawtooth';
    осц1.frequency.setValueAtTime(220, сейчас);
    осц1.frequency.exponentialRampToValueAtTime(80, сейчас + 0.6);
    усил1.gain.setValueAtTime(0.9, сейчас);
    усил1.gain.exponentialRampToValueAtTime(0.001, сейчас + 0.6);
    осц1.connect(усил1);
    усил1.connect(ctx.destination);
    осц1.start(сейчас);
    осц1.stop(сейчас + 0.6);
    
    const осц2 = ctx.createOscillator();
    const усил2 = ctx.createGain();
    осц2.type = 'square';
    осц2.frequency.setValueAtTime(110, сейчас);
    осц2.frequency.exponentialRampToValueAtTime(40, сейчас + 0.6);
    усил2.gain.setValueAtTime(0.5, сейчас);
    усил2.gain.exponentialRampToValueAtTime(0.001, сейчас + 0.6);
    осц2.connect(усил2);
    усил2.connect(ctx.destination);
    осц2.start(сейчас);
    осц2.stop(сейчас + 0.6);
}
    </script>
</body>
</html>
